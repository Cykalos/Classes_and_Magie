name: Release

# Chaque push sur main crée automatiquement une release :
#  - la version est calculée à partir des messages de commit (Conventional Commits)
#      feat: ...      -> version mineure (1.2.0 -> 1.3.0)
#      fix: ...       -> correctif (1.2.0 -> 1.2.1)
#      feat!: / BREAKING CHANGE -> version majeure
#  - le changelog est généré depuis les commits et ajouté à CHANGELOG.md
#  - le .jar est attaché à la release GitHub
# Ajoute [skip release] dans le message de commit pour ne pas publier.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]') && !startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcul de la version et du changelog
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v
          dry_run: true

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilation
        run: ./gradlew build --no-daemon -PreleaseVersion=${{ steps.version.outputs.new_version }}

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: CykClasses ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.version.outputs.changelog }}
          files: build/libs/CykClasses-${{ steps.version.outputs.new_version }}.jar
          make_latest: true

      - name: Mise à jour du CHANGELOG.md
        env:
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          touch CHANGELOG.md
          { printf '%s\n\n' "$CHANGELOG"; cat CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.new_tag }} [skip release]" || exit 0
          git push origin HEAD:main
