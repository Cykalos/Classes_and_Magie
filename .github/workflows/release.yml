name: Release

# Chaque push sur main publie automatiquement une release :
#  - version calculée depuis les messages de commit (Conventional Commits)
#      fix: ...                 -> correctif   (1.2.0 -> 1.2.1)
#      feat: ...                -> mineure     (1.2.0 -> 1.3.0)
#      feat!: / BREAKING CHANGE -> majeure     (1.2.0 -> 2.0.0)
#  - changelog généré depuis les commits, ajouté à la release et à CHANGELOG.md
#  - le .jar compilé est attaché à la release
# Ajoute [skip release] dans le message de commit pour ne rien publier.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]') && !startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version et changelog
        id: info
        run: .github/scripts/release-info.sh

      - name: Java 25
        if: steps.info.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        if: steps.info.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Compilation
        if: steps.info.outputs.skip != 'true'
        run: ./gradlew build --no-daemon -PreleaseVersion=${{ steps.info.outputs.version }}

      - name: Tag
        if: steps.info.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.info.outputs.tag }}" -m "Release ${{ steps.info.outputs.tag }}"
          git push origin "${{ steps.info.outputs.tag }}"

      - name: Release GitHub
        id: gh_release
        if: steps.info.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: Classes and Magie ${{ steps.info.outputs.tag }}
          body_path: release-notes.md
          files: "build/libs/Classes and Magie ${{ steps.info.outputs.version }}.jar"
          make_latest: true

      # GitHub remplace les espaces des fichiers par des points : on remet le vrai nom en libellé affiché
      - name: Nom affiché du .jar
        if: steps.info.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.gh_release.outputs.assets }}
        run: |
          for id in $(echo "$ASSETS" | jq -r '.[].id'); do
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
              -f label="Classes and Magie ${{ steps.info.outputs.version }}.jar" > /dev/null
          done

      - name: Mise à jour du CHANGELOG.md
        if: steps.info.outputs.skip != 'true'
        run: |
          [ -f CHANGELOG.md ] || echo "# Changelog" > CHANGELOG.md
          { head -n 1 CHANGELOG.md; echo; cat release-notes.md; tail -n +2 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.info.outputs.tag }} [skip release]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
