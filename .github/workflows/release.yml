name: Release

# Chaque push sur main publie automatiquement une release :
#  - version calculée depuis les messages de commit (Conventional Commits)
#      fix: ...                 -> correctif   (1.2.0 -> 1.2.1)
#      feat: ...                -> mineure     (1.2.0 -> 1.3.0)
#      feat!: / BREAKING CHANGE -> majeure     (1.2.0 -> 2.0.0)
#  - changelog généré depuis les commits, ajouté à la release et à CHANGELOG.md
#  - le .jar compilé est attaché à la release
# Ajoute [skip release] dans le message de commit pour ne rien publier.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]') && !startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version et changelog
        id: info
        run: .github/scripts/release-info.sh

      - name: Java 25
        if: steps.info.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        if: steps.info.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Compilation
        if: steps.info.outputs.skip != 'true'
        run: ./gradlew build --no-daemon -PreleaseVersion=${{ steps.info.outputs.version }}

      - name: Tag
        if: steps.info.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.info.outputs.tag }}" -m "Release ${{ steps.info.outputs.tag }}"
          git push origin "${{ steps.info.outputs.tag }}"

      - name: Release GitHub
        id: gh_release
        if: steps.info.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: Classes and Magie ${{ steps.info.outputs.tag }}
          body_path: release-notes.md
          files: build/libs/Classes_and_Magie-${{ steps.info.outputs.version }}.jar
          make_latest: true

      # Publication sur Modrinth : active seulement si le secret MODRINTH_TOKEN
      # et la variable MODRINTH_PROJECT_ID existent (Settings → Secrets and variables → Actions).
      # Variables facultatives : MODRINTH_VERSION_TYPE (release, beta, alpha ; beta par défaut)
      #                          MODRINTH_GAME_VERSIONS (">=26.1" par défaut)
      - name: Publication Modrinth
        if: steps.info.outputs.skip != 'true' && env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        # Un échec Modrinth (jeton expiré…) ne doit pas bloquer la release GitHub ni le CHANGELOG
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/Classes_and_Magie-${{ steps.info.outputs.version }}.jar
          name: Classes and Magie ${{ steps.info.outputs.version }}
          version: ${{ steps.info.outputs.version }}
          version-type: ${{ vars.MODRINTH_VERSION_TYPE || 'beta' }}
          changelog-file: release-notes.md
          loaders: |
            paper
            purpur
          game-versions: ${{ vars.MODRINTH_GAME_VERSIONS || '>=26.1' }}
          java: 25

      - name: Mise à jour du CHANGELOG.md
        if: steps.info.outputs.skip != 'true'
        run: |
          [ -f CHANGELOG.md ] || echo "# Changelog" > CHANGELOG.md
          # Insère les notes avant la première version (« ## »), après l'en-tête du fichier
          awk 'FNR==NR{notes=notes $0 "\n"; next} !done && /^## /{printf "%s\n", notes; done=1} {print} END{if(!done) printf "\n%s", notes}' release-notes.md CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.info.outputs.tag }} [skip release]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
