name: Nettoyage (unique)

# Supprime la release de test v0.0.1 créée par erreur. Ce fichier est retiré juste après.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Suppression de la release v0.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v0.0.1 --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
