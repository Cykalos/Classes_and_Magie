name: Build

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ['26.1.2.build.+', '26.2.build.+']
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compilation (Paper ${{ matrix.paper }})
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon "-PpaperVersion=${{ matrix.paper }}" 2>&1 | tee build.log || {
            grep -E "\.java:[0-9]+: (error|erreur)|What went wrong|Could not" -A2 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Contenu du jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          echo "::notice::$JAR $(du -h "$JAR" | cut -f1) - $(unzip -l "$JAR" | tail -1) - uniitem: $(unzip -l "$JAR" | grep -c 'libs/uniitem')"

      - name: Démarrage d'un serveur Paper (test)
        if: matrix.paper == '26.2.build.+'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          .github/scripts/smoke-test.sh 26.2 "$JAR"

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: Classes-and-Magie-paper-${{ strategy.job-index }}
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
