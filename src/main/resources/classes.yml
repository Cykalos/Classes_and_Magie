# ╔══════════════════════════════════════════════════════════════════╗
# ║                     CykClasses - classes.yml                     ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# STATISTIQUES (stats) — les sous-classes héritent de leur parent et ne
# redéfinissent que les valeurs voulues :
#   health / health-per-level      PV bonus (demi-cœurs, 20 = base vanilla)
#   mana / mana-per-level          mana maximum
#   mana-regen / mana-regen-per-level   mana par seconde
#   melee-damage / ranged-damage / magic-damage   multiplicateurs (1.2 = +20%)
#   damage-taken                   multiplicateur des dégâts subis (0.8 = -20%)
#   speed                          vitesse (+0.1 = +10%)
#   armor                          points d'armure bonus
#   attack-speed                   vitesse d'attaque (+0.1 = +10%)
#   crit-chance / crit-multiplier  coups critiques de mêlée
#
# DÉFAUTS (flaws) — types disponibles :
#   DAMAGE_TAKEN       causes: [FIRE, FIRE_TICK, LAVA, FALL, MAGIC, POISON, PROJECTILE, ENTITY_ATTACK, ...] + multiplier
#   FORBIDDEN_ARMOR    materials: [DIAMOND_*, NETHERITE_CHESTPLATE, SHIELD] (armure et main secondaire)
#   WEAPON_PENALTY     materials + multiplier (dégâts quand l'objet est tenu)
#   WATER_WEAKNESS     lent et faible dans l'eau
#   SUNLIGHT_WEAKNESS  faible en plein soleil
#   HUNGER             multiplier de la faim
#   HEALING_REDUCTION  multiplier des soins reçus
#   DARKNESS_MANA_BLOCK  pas de régénération de mana dans le noir
#   DAMAGE_DEALT       dégâts infligés × multiplier (kinds: [MELEE, RANGED, SKILL], targets: [ZOMBIE…])
#   MANA_REGEN         régénération de mana × multiplier
#   EFFECT             effets de potion (effects: ["slowness:1"]) tant que les conditions sont vraies
#   PERIODIC_DAMAGE    dégâts réguliers (damage, interval en secondes, fire-ticks)
#   DAMAGE_TAKEN accepte aussi damagers: [ZOMBIE, "*SKELETON", PLAYER, "mythic:NomDuMob"]
#   Tous les défauts acceptent un bloc « conditions » (nuit, pluie, biome, monde, PV bas, altitude…),
#   documenté en détail en haut de weaknesses.yml. Exemple :
#     - type: DAMAGE_TAKEN
#       multiplier: 1.3
#       conditions: {time: NIGHT, dimensions: [NORMAL]}
#       description: "+30% de dégâts subis la nuit"
#   inherit-flaws: false sur une sous-classe pour ne pas hériter des défauts du parent.
#
# CONDITIONS des sous-classes (requirements) :
#   LEVEL (amount) · KILLS (target: zombie|player|any, amount) · SKILL_USES (target: id|any, amount)
#   COUNTER (target: blocks_mined|damage_dealt|damage_taken|healing_done|mana_spent, amount)
#   PERMISSION (target: permission.node)
#
# COMPÉTENCES (skills) : type = implémentation Java, params = réglages.
#   mana, cooldown (s), unlock-level, health-cost (demi-cœurs), icon, name, description.
#   Les sous-classes gardent les compétences de leur classe parente (8 compétences max par classe
#   dans la barre : slots 1 à 8).
#
# ICÔNES (barre de compétences, touche F) :
#   icon: MATERIAL                       objet de base
#   icon-model: "monpack:skills/charge"  modèle de ton resource pack (composant item_model, 1.21.4+)
#   custom-model-data: 1001              alternative : custom model data (float)
#
# COMPÉTENCES MYTHICMOBS : type MYTHIC + params.skill = nom de la compétence MythicMobs
#   boule_ombre:
#     type: MYTHIC
#     name: "<dark_purple>Boule d'ombre"
#     icon: ECHO_SHARD
#     mana: 25
#     cooldown: 8
#     params: {skill: "MaCompetenceMythic", power: 1.0}

