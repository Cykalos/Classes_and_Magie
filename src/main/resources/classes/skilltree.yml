# ╔══════════════════════════════════════════════╗
# ║            CykClasses - skilltree.yml        ║
# ╚══════════════════════════════════════════════╝
# Un arbre par classe de base (clé = id de classe) + l'arbre "commun" accessible à tous.
# Points gagnés par niveau : config.yml → progression.
#
# Nœud :
#   x (0-8), y (0-4)    position dans le menu
#   max-rank, cost      rangs max et coût en points par rang
#   requires            nœuds à débloquer avant (au moins 1 rang)
#   required-level      niveau minimum
#   required-subclass   sous-classe requise (branches de spécialisation)
#   stats               bonus PAR RANG (mêmes clés que classes.yml)
#   skills              bonus PAR RANG sur une compétence :
#                         damage: 0.1 (+10 % dégâts/soins) · cooldown: -0.1 (-10 % recharge) · mana: -0.1 (-10 % coût)

