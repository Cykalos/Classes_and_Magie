reset-disabled: "<red>La réinitialisation de classe est désactivée."
reset-cooldown: "<red>Tu dois attendre encore <white><time></white> avant de changer de classe."
reset-done: "<yellow>Ta classe a été réinitialisée."
must-choose-class: "<yellow>Choisis ta classe pour commencer l'aventure !"

level-up: "<gold>⬆ Niveau supérieur ! <yellow>Tu es maintenant niveau <white><level></white>."
level-up-title: "<gold>Niveau <level>"
level-up-subtitle: "<yellow><class>"
xp-gain: "<dark_aqua>+<xp> XP <gray>(<class>)"
max-level: "<gray>Tu as atteint le niveau maximum."

skill-unknown: "<red>Compétence inconnue : <white><skill>"
skill-locked: "<red><skill> se débloque au niveau <white><level></white>."
skill-cooldown: "<red><skill> est en recharge (<white><time>s</white>)."
skill-no-mana: "<aqua>Pas assez de mana pour <skill> (<white><cost>✦</white>)."
skill-no-health: "<red>Pas assez de vie pour <skill>."
skill-no-target: "<gray>Aucune cible valide."
skill-cast: "<gray>» <skill>"

cast-mode-on: "<light_purple>✦ Mode compétences <gray>(touches 1-8, F pour quitter)"
cast-mode-off: "<gray>Mode compétences désactivé."
cast-mode-bar: "<light_purple>✦ <skills>"
cast-mode-entry: "<white><slot></white> <name> <dark_gray>[<mana>]</dark_gray>"
cast-mode-entry-cooldown: "<dark_gray><slot> <name> <red><time>s</red>"
cast-mode-entry-locked: "<dark_gray><slot> 🔒"

flaw-forbidden-armor: "<red>Ta classe ne peut pas porter <white><item></white> : objet retiré."
flaw-weapon-penalty: "<gray>Ta classe maîtrise mal cette arme (<red><penalty></red><gray> de dégâts)."

admin-set-level: "<green>Niveau de <white><player></white> défini à <white><level></white>."
admin-add-xp: "<green><white><xp></white> XP ajoutés à <white><player></white>."
admin-set-class: "<green>Classe de <white><player></white> définie sur <class><green>."
admin-reset: "<green>Classe de <white><player></white> réinitialisée."
admin-mana: "<green>Mana de <white><player></white> rempli."

info-header: "<gold><bold>━━ Profil de <player> ━━"
info-class: "<gray>Classe : <class>"
info-subclass: "<gray>Sous-classe : <subclass>"
info-level: "<gray>Niveau : <white><level></white> <dark_gray>(<xp>/<xp_required> XP)"
info-mana: "<gray>Mana : <aqua><mana>/<max_mana></aqua> <dark_gray>(+<regen>/s)"
info-stats: "<gray>Mêlée <white><melee></white> · Distance <white><ranged></white> · Magie <white><magic></white> · Dégâts subis <white><taken></white>"

help:
  - "<gold><bold>━━ CykClasses ━━"
  - "<yellow>/classe <gray>- ouvre le menu des classes"
  - "<yellow>/classe info [joueur] <gray>- affiche un profil"
  - "<yellow>/classe choisir <classe> <gray>- choisit une classe"
  - "<yellow>/classe sous-classe <gray>- menu des sous-classes"
  - "<yellow>/classe competences <gray>- liste tes compétences"
  - "<yellow>/classe reset <gray>- réinitialise ta classe"
  - "<yellow>/competence <id> <gray>- lance une compétence"
  - "<yellow>/groupe <gray>- crée ou affiche ton groupe"
  - "<gray>Astuce : appuie sur <white>F</white> pour passer en mode compétences puis sur <white>1-8</white>."
admin-help:
  - "<red>/classe admin setlevel <joueur> <niveau>"
  - "<red>/classe admin addxp <joueur> <xp>"
  - "<red>/classe admin setclass <joueur> <classe|sous-classe>"
  - "<red>/classe admin reset <joueur>"
  - "<red>/classe admin mana <joueur>"
  - "<red>/classe admin reload"

