  - "<yellow>/race · /traits · /metier <gray>- ton personnage"
  - "<yellow>/groupe <gray>- crée ou affiche ton groupe · <yellow>/gc <gray>/ <yellow>/global <gray>- chat"
  - "<gray>Astuce : appuie sur <white>F</white> pour passer en mode compétences puis sur <white>1-8</white>."
