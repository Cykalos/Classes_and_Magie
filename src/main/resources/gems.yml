# ╔══════════════════════════════════════════════╗
# ║              CykClasses - gems.yml           ║
# ╚══════════════════════════════════════════════╝
# Les gemmes sont trouvées BRUTES par les mineurs, puis TAILLÉES par un joaillier au tailleur de pierre
# (clic droit avec une gemme brute en main). La taille donne une rareté et une pureté qui multiplient ses stats.
# Une gemme taillée s'incruste dans un objet FORGÉ qui a un emplacement libre (voir forge.yml → sockets) :
# prends la gemme avec la souris et clique sur l'objet. Une gemme incrustée est définitive.

# Nom d'une gemme brute (<gem> = nom de la gemme)
raw-name: "<gray><gem> brut"
# Suffixe ajouté à item-model pour l'apparence brute (ex. "monpack:gems/rubis" + "_brut"), vide = même modèle
raw-model-suffix: ""

# Taille des gemmes
refining:
  # Bloc atelier et métiers autorisés (vide = tout le monde)
  station: STONECUTTER
  jobs: [joaillier]
  # Pureté (%) = aléatoire entre min et max, + per-level × niveau du métier, plafonnée à 100
  purity:
    min: 35
    max: 80
    per-level: 0.8
  # Multiplicateur des stats = power de la rareté × (purity-min-factor + (1 - purity-min-factor) × pureté)
  # ex. Rare (1.3) à 50 % de pureté : 1.3 × 0.75 = ×0.98 · Parfaite à 100 % : ×2.0
  purity-min-factor: 0.5
  # Raretés toujours à 100 % de pureté
  always-pure: [PARFAITE]
  rarities:
    COMMUNE:
      name: "<white>Commune"
      color: "<white>"
      weight: 100
      weight-per-level: -1.8
      min-weight: 15
      power: 0.8
    RAFFINEE:
      name: "<green>Raffinée"
      color: "<green>"
      weight: 35
      weight-per-level: 0.3
      power: 1.0
    RARE:
      name: "<aqua>Rare"
      color: "<aqua>"
      weight: 8
      weight-per-level: 0.6
      min-job-level: 5
      power: 1.3
    EPIQUE:
      name: "<light_purple>Épique"
      color: "<light_purple>"
      weight: 2
      weight-per-level: 0.35
      min-job-level: 15
      power: 1.6
    LEGENDAIRE:
      name: "<gold>Légendaire"
      color: "<gold>"
      weight: 0.3
      weight-per-level: 0.12
      min-job-level: 25
      power: 1.8
    PARFAITE:
      name: "<gold><bold>Parfaite</bold>"
      color: "<gold>"
      weight: 0.05
      weight-per-level: 0.03
      min-job-level: 35
      power: 2.0

socket-empty: "<dark_gray>◇ Emplacement de gemme libre"
socket-filled: "<white>◆ "

# Gemmes brutes trouvées en minant (blocs non posés par un joueur)
drops:
  # Métiers qui peuvent en trouver (vide = tout le monde)
  jobs: [mineur]
  targets: ["*_ORE", "ANCIENT_DEBRIS"]
  # Chance par bloc = base-chance + chance-per-job-level × niveau du métier
  base-chance: 0.01
  chance-per-job-level: 0.001

# applies-to : WEAPON (armes de mêlée), RANGED (arcs, arbalètes, tridents), ARMOR (armures, bouclier)
# weight : chance relative d'être trouvée · stats : mêmes clés que classes.yml
# material / item-model : apparence (item-model pour ton resource pack)
gems:
  rubis:
    name: "<red>Rubis"
    material: RED_DYE
    weight: 30
    description: ["<gray>Une pierre rouge sang."]
    applies-to: [WEAPON]
    stats: {melee-damage: 1.04}
  saphir:
    name: "<blue>Saphir"
    material: LAPIS_LAZULI
    weight: 30
    description: ["<gray>Imprégné de magie."]
    applies-to: [WEAPON, ARMOR]
    stats: {magic-damage: 1.04, mana: 10}
  emeraude:
    name: "<green>Émeraude"
    material: EMERALD
    weight: 25
    description: ["<gray>Vibrante de vie."]
    applies-to: [ARMOR]
    stats: {health: 2}
  topaze:
    name: "<yellow>Topaze"
    material: GOLD_NUGGET
    weight: 25
    description: ["<gray>Elle guide les coups vers les points faibles."]
    applies-to: [WEAPON, RANGED]
    stats: {crit-chance: 0.03}
  onyx:
    name: "<dark_gray>Onyx"
    material: COAL
    weight: 20
    description: ["<gray>Dure comme la roche."]
    applies-to: [ARMOR]
    stats: {damage-taken: 0.97, armor: 0.5}
  oeil_de_faucon:
    name: "<gold>Œil de faucon"
    material: RAW_GOLD
    weight: 15
    description: ["<gray>Pour les tireurs d'élite."]
    applies-to: [RANGED]
    stats: {ranged-damage: 1.05}
  diamant_pur:
    name: "<aqua><bold>Diamant pur"
    material: DIAMOND
    weight: 4
    description: ["<gray>Une pierre parfaite, d'une rareté extrême."]
    applies-to: [WEAPON, RANGED, ARMOR]
    stats: {melee-damage: 1.03, ranged-damage: 1.03, magic-damage: 1.03, health: 2}
