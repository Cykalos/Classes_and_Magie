# ╔══════════════════════════════════════════════╗
# ║          Classes and Magie - traits.yml      ║
# ╚══════════════════════════════════════════════╝
# Traits rolled at random after choosing the race.
#   rarity : COMMON, UNCOMMON, RARE, EPIC, UNIQUE (only one player on the server can have it)
#   kind   : POSITIVE, NEGATIVE, MIXED
#   weight : relative chance (default: roll.rarity-weights by rarity)
#   stats / flaws / effects : as in races.yml
#   conflicts : incompatible traits (never rolled together)

roll:
  # Number of traits rolled
  count: 3
  # At most X negative traits, at least Y positive ones
  max-negative: 1
  min-positive: 1
  # Chance to also receive a UNIQUE trait that is still free (0.01 = 1%)
  unique-chance: 0.01
  # Number of rerolls allowed per player
  rerolls: 3
  rarity-weights:
    COMMON: 60
    UNCOMMON: 25
    RARE: 10
    EPIC: 3

traits:
  # ─────────── Positive ───────────
  sturdy:
    name: "<green>Sturdy"
    rarity: COMMON
    kind: POSITIVE
    description: ["<gray>A solid constitution."]
    stats: {health: 2}
    conflicts: [fragile]
  quick:
    name: "<green>Quick"
    rarity: COMMON
    kind: POSITIVE
    description: ["<gray>Always on the move."]
    stats: {speed: 0.05}
    conflicts: [slow]
  scholar:
    name: "<green>Scholar"
    rarity: COMMON
    kind: POSITIVE
    description: ["<gray>Years of reading."]
    stats: {mana: 20}
  brawny:
    name: "<green>Brawny"
    rarity: UNCOMMON
    kind: POSITIVE
    description: ["<gray>Arms like tree trunks."]
    stats: {melee-damage: 1.07}
    conflicts: [puny]
  eagle_eye:
    name: "<green>Eagle Eye"
    rarity: UNCOMMON
    kind: POSITIVE
    description: ["<gray>Nothing escapes your gaze."]
    stats: {ranged-damage: 1.08}
  sharp_mind:
    name: "<green>Sharp Mind"
    rarity: UNCOMMON
    kind: POSITIVE
    description: ["<gray>Mana flows through you."]
    stats: {mana-regen: 0.7}
  thick_skin:
    name: "<aqua>Thick Skin"
    rarity: RARE
    kind: POSITIVE
    description: ["<gray>Blows slide off you."]
    stats: {damage-taken: 0.93, armor: 1}
  lucky:
    name: "<aqua>Lucky"
    rarity: RARE
    kind: POSITIVE
    description: ["<gray>Luck smiles on you in battle."]
    stats: {crit-chance: 0.07}
    effects: ["luck:1"]
  born_arcanist:
    name: "<light_purple>Born Arcanist"
    rarity: EPIC
    kind: POSITIVE
    description: ["<gray>An extraordinary magical talent."]
    stats: {magic-damage: 1.12, mana: 30}
  titan_blood:
    name: "<light_purple>Titan Blood"
    rarity: EPIC
    kind: POSITIVE
    description: ["<gray>A distant giant ancestor."]
    stats: {health: 6, melee-damage: 1.05}

  # ─────────── Negative ───────────
  fragile:
    name: "<red>Fragile"
    rarity: COMMON
    kind: NEGATIVE
    description: ["<gray>Delicate health."]
    stats: {health: -2}
    conflicts: [sturdy]
  slow:
    name: "<red>Slow"
    rarity: COMMON
    kind: NEGATIVE
    description: ["<gray>Never in a hurry."]
    stats: {speed: -0.05}
    conflicts: [quick]
  puny:
    name: "<red>Puny"
    rarity: COMMON
    kind: NEGATIVE
    description: ["<gray>Not very muscular."]
    stats: {melee-damage: 0.93}
    conflicts: [brawny]
  glutton:
    name: "<red>Glutton"
    rarity: COMMON
    kind: NEGATIVE
    description: ["<gray>Always starving."]
    flaws:
      - type: HUNGER
        multiplier: 1.3
        description: "Gets hungry 30% faster"
  hemophiliac:
    name: "<red>Hemophiliac"
    rarity: UNCOMMON
    kind: NEGATIVE
    description: ["<gray>Wounds heal poorly."]
    flaws:
      - type: HEALING_REDUCTION
        multiplier: 0.8
        description: "Healing received -20%"
  fear_of_heights:
    name: "<red>Fear of Heights"
    rarity: UNCOMMON
    kind: NEGATIVE
    description: ["<gray>Heights terrify you."]
    flaws:
      - type: DAMAGE_TAKEN
        causes: [FALL]
        multiplier: 1.5
        description: "+50% fall damage"

  # ─────────── Mixed ───────────
  hothead:
    name: "<gold>Hothead"
    rarity: UNCOMMON
    kind: MIXED
    description: ["<gray>Hits hard, forgets to guard."]
    stats: {melee-damage: 1.1, damage-taken: 1.08}
  insomniac:
    name: "<gold>Insomniac"
    rarity: RARE
    kind: MIXED
    description: ["<gray>Sees in the dark, but tired."]
    effects: ["night_vision:1"]
    stats: {mana-regen: -0.3}
  cold_blooded:
    name: "<gold>Cold-Blooded"
    rarity: RARE
    kind: MIXED
    description: ["<gray>Precise but distant."]
    stats: {crit-chance: 0.08, health: -2}

  # ─────────── Unique (only one player on the whole server) ───────────
  chosen_of_the_gods:
    name: "<gold><bold>Chosen of the Gods"
    rarity: UNIQUE
    kind: POSITIVE
    description:
      - "<gray>The gods have set their eyes on you."
      - "<gold>Only one player can bear this trait."
    stats: {health: 8, magic-damage: 1.15, mana: 50, mana-regen: 1}
    effects: ["regeneration:1"]
  legendary_weapon_master:
    name: "<gold><bold>Legendary Weapon Master"
    rarity: UNIQUE
    kind: POSITIVE
    description:
      - "<gray>No weapon holds secrets for you."
      - "<gold>Only one player can bear this trait."
    stats: {melee-damage: 1.15, ranged-damage: 1.15, crit-chance: 0.1, attack-speed: 0.1}
  cursed_immortal:
    name: "<dark_purple><bold>Cursed Immortal"
    rarity: UNIQUE
    kind: MIXED
    description:
      - "<gray>An ancient curse: death refuses you."
      - "<gold>Only one player can bear this trait."
    stats: {health: 14, damage-taken: 0.85}
    flaws:
      - type: SUNLIGHT_WEAKNESS
        description: "Weakened in direct sunlight"
      - type: HEALING_REDUCTION
        multiplier: 0.5
        description: "Healing received -50%"
