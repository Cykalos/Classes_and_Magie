# Example secret quests — invisible in the journal until they are discovered
# They start on their own when their conditions are met (conditions:) or on a specific action (trigger:).
# Full quest format: see the top of tutorial.yml
#
# Example with a named NPC (a villager renamed with a name tag, or a Citizens NPC):
#   trigger: {type: INTERACT_ENTITY, targets: [VILLAGER], name: "Hermit"}

quests:
  the_sunken_treasure:
    name: "<dark_aqua>The Sunken Treasure"
    category: SECRET
    level: 15
    icon: HEART_OF_THE_SEA
    description:
      - "<gray>Shipwrecks sometimes hide"
      - "<gray>much more than gold."
    requirements:
      level: 15
    # Discovered by swimming deep in an ocean
    conditions: {biomes: ["*OCEAN*"], in-water: true, y-below: 35}
    stages:
      - text: ["<dark_aqua>A blue glow shines at the bottom of the water…"]
        objectives:
          - {type: COLLECT, targets: [HEART_OF_THE_SEA], amount: 1, display: "Find a heart of the sea"}
    rewards:
      xp: 1500
      attribute-points: 2
      titles: [deep_diver]

  the_stormy_night:
    name: "<yellow>The Stormy Night"
    category: SECRET
    level: 8
    icon: LIGHTNING_ROD
    description:
      - "<gray>When thunder rumbles, creepers"
      - "<gray>become unpredictable."
    requirements:
      level: 8
    # 20% chance to discover it by killing a creeper during a thunderstorm
    trigger:
      type: KILL
      targets: [CREEPER]
      conditions: {weather: [THUNDER], chance: 0.2}
    stages:
      - text: ["<yellow>Lightning strikes close by… <gray>The storm draws the creepers."]
        objectives:
          - {type: KILL, targets: [CREEPER], amount: 5, conditions: {weather: [THUNDER]}, display: "Kill 5 creepers during the storm"}
    rewards:
      xp: 900
      money: 150
      titles: [storm_chaser]

  the_secret_garden:
    name: "<light_purple>The Secret Garden"
    category: SECRET
    level: 5
    icon: PINK_PETALS
    description:
      - "<gray>At night, the cherry trees whisper."
    requirements:
      level: 5
    # Discovered at night in a cherry grove
    conditions: {biomes: [CHERRY_GROVE], time: NIGHT}
    stages:
      - text: ["<light_purple>Petals swirl around you…"]
        objectives:
          - {type: COLLECT, targets: [PINK_PETALS], amount: 16, take: true, display: "Gather pink petals"}
    rewards:
      xp: 500
      items:
        - {item: "minecraft:cherry_sapling", amount: 4}

  the_song_of_the_bees:
    name: "<gold>The Song of the Bees"
    category: SECRET
    level: 3
    icon: HONEYCOMB
    description:
      - "<gray>Beehives have secrets of their own."
    requirements:
      level: 3
    # 25% chance to discover it by using a beehive or a bee nest
    trigger:
      type: INTERACT_BLOCK
      targets: [BEEHIVE, BEE_NEST]
      conditions: {chance: 0.25}
    stages:
      - text: ["<gold>A happy buzzing… <gray>the bees have honey to share."]
        objectives:
          - {type: COLLECT, targets: [HONEY_BOTTLE], amount: 4, take: true, display: "Gather honey bottles"}
    rewards:
      xp: 400
      money: 80
