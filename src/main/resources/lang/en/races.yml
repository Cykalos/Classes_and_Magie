# ╔══════════════════════════════════════════════╗
# ║          Classes and Magie - races.yml       ║
# ╚══════════════════════════════════════════════╝
# Chosen after the class. Each race has:
#   stats       : modifiers (same keys as classes.yml; damage values are multipliers, 1.1 = +10%)
#   flaws       : flaws (same types as classes.yml)
#   effects     : permanent effects ("night_vision:1", "speed:1"...)
#   recommended-classes : shown as recommended
#   class-penalties : penalties when the race plays a class (or subclass) it is not made for
#   weaknesses  : weaknesses imposed on the race (ids from weaknesses.yml)

races:
  human:
    name: "<white><bold>Human"
    icon: PLAYER_HEAD
    description:
      - "<gray>Versatile and adaptable."
      - "<gray>No weakness, no great talent."
    stats:
      health: 2
      mana: 10
    recommended-classes: [warrior, mage, archer, assassin, cleric]

  elf:
    name: "<green><bold>Elf"
    icon: OAK_SAPLING
    description:
      - "<gray>Graceful and bound to magic."
      - "<gray>Fragile but agile and precise."
    stats:
      health: -2
      mana: 30
      mana-regen: 0.5
      ranged-damage: 1.1
      magic-damage: 1.05
      speed: 0.05
    effects: ["night_vision:1"]
    flaws:
      - type: DAMAGE_TAKEN
        causes: [ENTITY_ATTACK]
        multiplier: 1.1
        description: "+10% melee damage taken"
    recommended-classes: [archer, mage, cleric]
    # Imposed weaknesses (defined in weaknesses.yml)
    weaknesses: [claustrophobic]
    class-penalties:
      warrior:
        description: "Too frail for the warrior's heavy armor."
        stats: {melee-damage: 0.9, armor: -2}
      berserker:
        description: "Blind rage is not in elven nature."
        stats: {melee-damage: 0.85}

  dwarf:
    name: "<gold><bold>Dwarf"
    icon: IRON_PICKAXE
    description:
      - "<gray>Sturdy, stubborn and a smith at heart."
      - "<gray>Slow, but almost unshakable."
    stats:
      health: 6
      armor: 2
      damage-taken: 0.92
      speed: -0.05
      mana: -20
    effects: ["haste:1"]
    flaws:
      - type: DAMAGE_TAKEN
        causes: [DROWNING]
        multiplier: 1.5
        description: "Poor swimmer: +50% drowning damage"
    recommended-classes: [warrior, cleric]
    weaknesses: [vertigo]
    class-penalties:
      mage:
        description: "Dwarves distrust pure magic."
        stats: {magic-damage: 0.85, mana-regen: -1}
      archer:
        description: "Too short for longbows."
        stats: {ranged-damage: 0.9}
      assassin:
        description: "Not exactly stealthy."
        stats: {speed: -0.05, crit-chance: -0.05}

  orc:
    name: "<dark_green><bold>Orc"
    icon: ZOMBIE_HEAD
    description:
      - "<gray>Brutal and tough."
      - "<gray>Hits hard, thinks little."
    stats:
      health: 8
      melee-damage: 1.15
      magic-damage: 0.85
      mana: -30
    flaws:
      - type: HUNGER
        multiplier: 1.3
        description: "Gets hungry 30% faster"
      - type: SUNLIGHT_WEAKNESS
        description: "Weakened in direct sunlight"
    recommended-classes: [warrior, assassin]
    weaknesses: [poor_shot]
    class-penalties:
      mage:
        description: "Magic resists the orcish mind."
        stats: {magic-damage: 0.8, mana: -30}
        flaws:
          - type: DARKNESS_MANA_BLOCK
            description: "No mana regeneration in the dark"
      cleric:
        description: "The gods rarely listen to orcs."
        stats: {magic-damage: 0.85}
      priest:
        description: "The gods rarely listen to orcs."
        stats: {magic-damage: 0.8, mana-regen: -1}

  tiefling:
    name: "<dark_red><bold>Tiefling"
    icon: BLAZE_POWDER
    description:
      - "<gray>Demonic blood: fire in the veins."
      - "<gray>Fears water and holy light."
    stats:
      magic-damage: 1.15
      mana: 20
      crit-chance: 0.03
    effects: ["fire_resistance:1"]
    flaws:
      - type: WATER_WEAKNESS
        description: "Slow and weakened in water"
      - type: HEALING_REDUCTION
        multiplier: 0.8
        description: "Healing received -20%"
    recommended-classes: [mage, assassin]
    weaknesses: [infernal_blood]
    class-penalties:
      cleric:
        description: "Holy magic burns demonic blood."
        stats: {health: -4}
        flaws:
          - type: DAMAGE_TAKEN
            causes: [MAGIC]
            multiplier: 1.3
            description: "+30% magic damage taken"
      paladin:
        description: "A demon paladin? The gods object."
        stats: {magic-damage: 0.8, health: -4}
      cryomancer:
        description: "Cold puts out the inner fire."
        stats: {magic-damage: 0.85}

  felys:
    name: "<yellow><bold>Felys"
    icon: RABBIT_FOOT
    description:
      - "<gray>Feline folk, quick and silent."
      - "<gray>Always lands on their feet."
    stats:
      speed: 0.1
      attack-speed: 0.1
      crit-chance: 0.05
      health: -2
    effects: ["jump_boost:1"]
    flaws:
      - type: WATER_WEAKNESS
        description: "Hates water: slow and weakened"
      - type: DAMAGE_TAKEN
        causes: [FALL]
        multiplier: 0.5
        description: "Bonus: -50% fall damage"
    recommended-classes: [assassin, archer]
    weaknesses: [cold_sensitive]
    class-penalties:
      warrior:
        description: "Too light to hold the front line."
        stats: {damage-taken: 1.1}
      paladin:
        description: "Heavy armor hinders feline agility."
        stats: {speed: -0.1}
