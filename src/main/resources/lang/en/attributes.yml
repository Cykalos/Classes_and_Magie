# ╔══════════════════════════════════════════════╗
# ║       Classes and Magie - attributes.yml     ║
# ╚══════════════════════════════════════════════╝
# Attribute points (/stats): earned when levelling up (config.yml → progression).
# per-point: effect of EACH point (multipliers stack: 1.01 = +1% per point).

attributes:
  strength:
    name: "<red><bold>Strength"
    icon: IRON_SWORD
    description: ["<gray>Melee power."]
    max: 50
    per-point: {melee-damage: 1.01}
  dexterity:
    name: "<green><bold>Dexterity"
    icon: BOW
    description: ["<gray>Ranged accuracy and critical hits."]
    max: 50
    per-point: {ranged-damage: 1.01, crit-chance: 0.002}
  intelligence:
    name: "<light_purple><bold>Intelligence"
    icon: ENCHANTED_BOOK
    description: ["<gray>Spell power and mana pool."]
    max: 50
    per-point: {magic-damage: 1.01, mana: 3}
  vitality:
    name: "<dark_red><bold>Vitality"
    icon: GOLDEN_APPLE
    description: ["<gray>Extra health."]
    max: 50
    per-point: {health: 0.5}
  wisdom:
    name: "<aqua><bold>Wisdom"
    icon: LAPIS_LAZULI
    description: ["<gray>Mana regeneration."]
    max: 50
    per-point: {mana-regen: 0.08}
  agility:
    name: "<yellow><bold>Agility"
    icon: FEATHER
    description: ["<gray>Movement and attack speed."]
    max: 30
    per-point: {speed: 0.004, attack-speed: 0.005}
  endurance:
    name: "<gray><bold>Endurance"
    icon: IRON_CHESTPLATE
    description: ["<gray>Reduces damage taken."]
    max: 30
    per-point: {damage-taken: 0.995, armor: 0.1}
