# ╔══════════════════════════════════════════════════════════════════╗
# ║                 Classes and Magie - classes.yml                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# STATS (stats) — subclasses inherit from their parent and only
# redefine the values they want to change:
#   health / health-per-level      bonus health (half-hearts, 20 = vanilla base)
#   mana / mana-per-level          maximum mana
#   mana-regen / mana-regen-per-level   mana per second
#   melee-damage / ranged-damage / magic-damage   multipliers (1.2 = +20%)
#   damage-taken                   damage taken multiplier (0.8 = -20%)
#   speed                          speed (+0.1 = +10%)
#   armor                          bonus armor points
#   attack-speed                   attack speed (+0.1 = +10%)
#   crit-chance / crit-multiplier  melee critical hits
#
# FLAWS (flaws) — available types:
#   DAMAGE_TAKEN       causes: [FIRE, FIRE_TICK, LAVA, FALL, MAGIC, POISON, PROJECTILE, ENTITY_ATTACK, ...] + multiplier
#   FORBIDDEN_ARMOR    materials: [DIAMOND_*, NETHERITE_CHESTPLATE, SHIELD] (armor and off hand)
#   WEAPON_PENALTY     materials + multiplier (damage while the item is held)
#   WATER_WEAKNESS     slow and weak in water
#   SUNLIGHT_WEAKNESS  weak in full sunlight
#   HUNGER             hunger multiplier
#   HEALING_REDUCTION  healing received multiplier
#   DARKNESS_MANA_BLOCK  no mana regeneration in the dark
#   DAMAGE_DEALT       damage dealt × multiplier (kinds: [MELEE, RANGED, SKILL], targets: [ZOMBIE…])
#   MANA_REGEN         mana regeneration × multiplier
#   EFFECT             potion effects (effects: ["slowness:1"]) while the conditions are true
#   PERIODIC_DAMAGE    regular damage (damage, interval in seconds, fire-ticks)
#   DAMAGE_TAKEN also accepts damagers: [ZOMBIE, "*SKELETON", PLAYER, "mythic:MobName"]
#   Every flaw accepts a "conditions" block (night, rain, biome, world, low health, altitude…),
#   documented in detail at the top of weaknesses.yml. Example:
#     - type: DAMAGE_TAKEN
#       multiplier: 1.3
#       conditions: {time: NIGHT, dimensions: [NORMAL]}
#       description: "+30% damage taken at night"
#   inherit-flaws: false on a subclass to not inherit the parent's flaws.
#
# Subclass CONDITIONS (requirements):
#   LEVEL (amount) · KILLS (target: zombie|player|any, amount) · SKILL_USES (target: id|any, amount)
#   COUNTER (target: blocks_mined|damage_dealt|damage_taken|healing_done|mana_spent, amount)
#   PERMISSION (target: permission.node)
#
# SKILLS (skills): type = Java implementation, params = settings.
#   mana, cooldown (s), unlock-level, health-cost (half-hearts), icon, name, description.
#   Subclasses keep the skills of their parent class (8 skills max per class
#   in the bar: slots 1 to 8).
#
# ICONS (skill bar, F key):
#   icon: MATERIAL                       base item
#   icon-model: "mypack:skills/charge"   model from your resource pack (item_model component, 1.21.4+)
#   custom-model-data: 1001              alternative: custom model data (float)
#
# MYTHICMOBS SKILLS: type MYTHIC + params.skill = name of the MythicMobs skill
#   shadow_ball:
#     type: MYTHIC
#     name: "<dark_purple>Shadow ball"
#     icon: ECHO_SHARD
#     mana: 25
#     cooldown: 8
#     params: {skill: "MyMythicSkill", power: 1.0}

