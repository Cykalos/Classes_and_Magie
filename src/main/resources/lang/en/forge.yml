# ╔══════════════════════════════════════════════╗
# ║           Classes and Magie - forge.yml      ║
# ╚══════════════════════════════════════════════╝
# Quality items: when a player with one of these jobs crafts a listed item,
# the item gets a rarity, random stats (positive or negative) and gem sockets.
# The higher the job level, the more likely the high rarities.
# Stats apply while the item is equipped (weapon in hand, armor worn, shield in off hand).
# Quality items are crafted one at a time (no Shift + click).

crafters:
  blacksmith:
    targets:
      - "(IRON|GOLDEN|DIAMOND|NETHERITE|CHAINMAIL)_(SWORD|AXE|HELMET|CHESTPLATE|LEGGINGS|BOOTS)"
      - "SHIELD"
      - "CROSSBOW"
      - "BOW"
      - "MACE"
  # Example: an "archer-artisan" who would craft bows
  # bowyer:
  #   targets: ["BOW", "CROSSBOW"]

# Rarities, from most common to rarest.
#   weight / weight-per-level / min-weight: relative chance = max(min-weight, weight + weight-per-level × job level)
#   min-job-level: minimum job level to be able to get it
#   stats [min, max]: number of random stats · sockets: gem sockets
#   power: stat strength multiplier · negative-chance: chance for a stat to be negative
rarities:
  COMMON:
    name: "<white>Common"
    color: "<white>"
    weight: 100
    weight-per-level: -1.8
    min-weight: 15
    stats: [0, 1]
    sockets: 0
    power: 0.6
    negative-chance: 0.5
  UNCOMMON:
    name: "<green>Uncommon"
    color: "<green>"
    weight: 35
    weight-per-level: 0.3
    stats: [1, 2]
    sockets: 1
    power: 0.8
    negative-chance: 0.35
  RARE:
    name: "<aqua>Rare"
    color: "<aqua>"
    weight: 8
    weight-per-level: 0.6
    min-job-level: 5
    stats: [2, 3]
    sockets: 1
    power: 1.0
    negative-chance: 0.25
  EPIC:
    name: "<light_purple>Epic"
    color: "<light_purple>"
    weight: 2
    weight-per-level: 0.35
    min-job-level: 15
    stats: [3, 4]
    sockets: 2
    power: 1.25
    negative-chance: 0.15
  LEGENDARY:
    name: "<gold>Legendary"
    color: "<gold>"
    weight: 0.3
    weight-per-level: 0.12
    min-job-level: 25
    stats: [4, 5]
    sockets: 3
    power: 1.5
    negative-chance: 0.05
  # UNIQUE: gives one of the unique items below that has never been forged (one copy on the whole server).
  # If none is left for this item type, the item becomes Legendary.
  UNIQUE:
    name: "<gold><bold>UNIQUE</bold>"
    color: "<gold>"
    weight: 0.02
    weight-per-level: 0.02
    min-job-level: 30

# A negative stat is worth (rolled value × negative-scale) less
negative-scale: 0.6

# Possible stats per item type: [min, max] before the rarity "power" multiplier.
# Percentages: 0.05 = 5%. Positive damage-taken = less damage taken.
stat-pool:
  weapon:
    melee-damage: [0.02, 0.08]
    crit-chance: [0.01, 0.05]
    crit-multiplier: [0.05, 0.25]
    attack-speed: [0.02, 0.08]
    magic-damage: [0.02, 0.07]
    health: [1, 3]
    mana: [5, 20]
  ranged:
    ranged-damage: [0.02, 0.08]
    crit-chance: [0.01, 0.05]
    speed: [0.01, 0.03]
    mana: [5, 15]
    health: [1, 2]
  armor:
    health: [1, 4]
    armor: [0.5, 2]
    damage-taken: [0.01, 0.04]
    mana: [5, 15]
    mana-regen: [0.1, 0.4]
    speed: [0.01, 0.03]
    magic-damage: [0.01, 0.04]

# Unique items: each one can only be forged ONCE on the whole server.
# materials: base items it can appear on. Fixed stats (same format as classes.yml).
# History in forge-uniques.yml · /class admin releaseunique <id> to make it available again:
# the old copy then loses its power (it breaks as soon as it is in a player's inventory).
uniques:
  excalibur:
    name: "<gold><bold>Excalibur"
    materials: ["*_SWORD"]
    lore: ["<gray>The sword of the legendary king.", "<gray>It only answers the worthiest."]
    sockets: 3
    stats: {melee-damage: 1.2, crit-chance: 0.1, health: 4}
  mountain_breaker:
    name: "<gold><bold>Mountain Breaker"
    materials: ["*_AXE", "MACE"]
    lore: ["<gray>Forged in the heart of a volcano."]
    sockets: 3
    stats: {melee-damage: 1.25, crit-multiplier: 0.5, speed: -0.03}
  aegis:
    name: "<gold><bold>Aegis"
    materials: ["SHIELD", "*_CHESTPLATE"]
    lore: ["<gray>No blow gets through it."]
    sockets: 3
    stats: {damage-taken: 0.85, health: 6, armor: 3}
  whisper_of_the_wind:
    name: "<gold><bold>Whisper of the Wind"
    materials: ["BOW", "CROSSBOW"]
    lore: ["<gray>Its arrows make no sound."]
    sockets: 3
    stats: {ranged-damage: 1.25, crit-chance: 0.08, speed: 0.04}
