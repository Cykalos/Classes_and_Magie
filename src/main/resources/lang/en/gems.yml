# ╔══════════════════════════════════════════════╗
# ║         Classes and Magie - gems.yml         ║
# ╚══════════════════════════════════════════════╝
# Gems are found RAW by miners, then CUT by a jeweler at the stonecutter
# (right click with a raw gem in hand). Cutting gives a rarity and a purity that multiply its stats.
# A cut gem is socketed into a FORGED item that has a free socket (see forge.yml → sockets):
# pick up the gem with the mouse and click the item. A socketed gem is permanent.
# Rarity ids (COMMUNE, RAFFINEE…) and gem ids are internal: only the names are shown in game.

# Name of a raw gem (<gem> = gem name)
raw-name: "<gray>Raw <gem>"
# Suffix added to item-model for the raw look (e.g. "mypack:gems/ruby" + "_raw"), empty = same model
raw-model-suffix: ""

# Gem cutting
refining:
  # Workshop block and allowed jobs (empty = everyone)
  station: STONECUTTER
  jobs: [joaillier]
  # Purity (%) = random between min and max, + per-level × job level, capped at 100
  purity:
    min: 35
    max: 80
    per-level: 0.8
  # Stat multiplier = rarity power × (purity-min-factor + (1 - purity-min-factor) × purity)
  # e.g. Rare (1.3) at 50% purity: 1.3 × 0.75 = ×0.98 · Perfect at 100%: ×2.0
  purity-min-factor: 0.5
  # Rarities always at 100% purity
  always-pure: [PARFAITE]
  rarities:
    COMMUNE:
      name: "<white>Common"
      color: "<white>"
      weight: 100
      weight-per-level: -1.8
      min-weight: 15
      power: 0.8
    RAFFINEE:
      name: "<green>Refined"
      color: "<green>"
      weight: 35
      weight-per-level: 0.3
      power: 1.0
    RARE:
      name: "<aqua>Rare"
      color: "<aqua>"
      weight: 8
      weight-per-level: 0.6
      min-job-level: 5
      power: 1.3
    EPIQUE:
      name: "<light_purple>Epic"
      color: "<light_purple>"
      weight: 2
      weight-per-level: 0.35
      min-job-level: 15
      power: 1.6
    LEGENDAIRE:
      name: "<gold>Legendary"
      color: "<gold>"
      weight: 0.3
      weight-per-level: 0.12
      min-job-level: 25
      power: 1.8
    PARFAITE:
      name: "<gold><bold>Perfect</bold>"
      color: "<gold>"
      weight: 0.05
      weight-per-level: 0.03
      min-job-level: 35
      power: 2.0

# Socketing: jobs allowed to socket a cut gem (empty = everyone)
socketing:
  jobs: [joaillier]

socket-empty: "<dark_gray>◇ Free gem socket"
socket-filled: "<white>◆ "

# Raw gems found while mining (blocks not placed by a player)
drops:
  # Jobs that can find them (empty = everyone)
  jobs: [mineur]
  targets: ["*_ORE", "ANCIENT_DEBRIS"]
  # Chance per block = base-chance + chance-per-job-level × job level
  base-chance: 0.01
  chance-per-job-level: 0.001

# applies-to: WEAPON (melee weapons), RANGED (bows, crossbows, tridents), ARMOR (armor, shield)
# weight: relative chance of being found · stats: same keys as classes.yml
# material / item-model: look (item-model for your resource pack)
gems:
  rubis:
    name: "<red>Ruby"
    material: RED_DYE
    weight: 30
    description: ["<gray>A blood-red stone."]
    applies-to: [WEAPON]
    stats: {melee-damage: 1.04}
  saphir:
    name: "<blue>Sapphire"
    material: LAPIS_LAZULI
    weight: 30
    description: ["<gray>Steeped in magic."]
    applies-to: [WEAPON, ARMOR]
    stats: {magic-damage: 1.04, mana: 10}
  emeraude:
    name: "<green>Emerald"
    material: EMERALD
    weight: 25
    description: ["<gray>Throbbing with life."]
    applies-to: [ARMOR]
    stats: {health: 2}
  topaze:
    name: "<yellow>Topaz"
    material: GOLD_NUGGET
    weight: 25
    description: ["<gray>It guides blows to weak spots."]
    applies-to: [WEAPON, RANGED]
    stats: {crit-chance: 0.03}
  onyx:
    name: "<dark_gray>Onyx"
    material: COAL
    weight: 20
    description: ["<gray>Hard as rock."]
    applies-to: [ARMOR]
    stats: {damage-taken: 0.97, armor: 0.5}
  oeil_de_faucon:
    name: "<gold>Hawk's eye"
    material: RAW_GOLD
    weight: 15
    description: ["<gray>For marksmen."]
    applies-to: [RANGED]
    stats: {ranged-damage: 1.05}
  diamant_pur:
    name: "<aqua><bold>Pure diamond"
    material: DIAMOND
    weight: 4
    description: ["<gray>A flawless stone, extremely rare."]
    applies-to: [WEAPON, RANGED, ARMOR]
    stats: {melee-damage: 1.03, ranged-damage: 1.03, magic-damage: 1.03, health: 2}
