# ╔══════════════════════════════════════════════╗
# ║        Classes and Magie - skilltree.yml     ║
# ╚══════════════════════════════════════════════╝
# One tree per base class (key = class id) + the "common" tree available to everyone.
# Points earned per level: config.yml → progression.
#
# Node:
#   x (0-8), y (0-4)    position in the menu
#   max-rank, cost      max ranks and point cost per rank
#   requires            nodes to unlock first (at least 1 rank)
#   required-level      minimum level
#   required-subclass   required subclass (specialisation branches)
#   stats               bonus PER RANK (same keys as classes.yml)
#   skills              bonus PER RANK on a skill:
#                         damage: 0.1 (+10% damage/healing) · cooldown: -0.1 (-10% cooldown) · mana: -0.1 (-10% cost)

