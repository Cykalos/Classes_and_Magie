name: Classes_and_Magie
version: '${version}'
main: fr.cykalos.cykclasses.CykClasses
api-version: '26.1'
description: RPG classes with subclasses, unique skills, stats, weaknesses, mana, jobs, quests and titles.
authors: [Cykalos]
website: https://github.com/Cykalos/Classes_and_Magie
softdepend: [PlaceholderAPI, Vault, MythicMobs, CraftEngine, ExecutableItems, ItemsAdder, Oraxen, Nexo, MMOItems]
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3

commands:
  classe:
    description: Class menu and class management.
    usage: /class [info|choose|subclass|skills|quests|titles|reset|admin]
    aliases: [class, classes]
  competence:
    description: Casts a skill of your class.
    usage: /skill <id|number>
    aliases: [skill, cast]
  groupe:
    description: Creates and manages a party (rules set at creation).
    usage: /party [create|invite|accept|deny|leave|kick|lead|disband|info|chat]
    aliases: [party, grp]
  gc:
    description: Party chat (without a message, switches your chat to the party).
    usage: /gc [message]
    aliases: [pc]
  global:
    description: Back to global chat (or sends one global message).
    usage: /global [message]
    aliases: [all]
  race:
    description: Race of your character.
    usage: /race
  traits:
    description: Your traits (and reroll).
    usage: /traits [reroll]
  faiblesses:
    description: Weaknesses of your character (and reroll).
    usage: /weaknesses [reroll]
    aliases: [weaknesses, faiblesse, weakness]
  metier:
    description: Choose or view your job.
    usage: /job
    aliases: [job, metiers, jobs]
  arbre:
    description: Skill tree.
    usage: /tree [reset]
    aliases: [skilltree, talents, tree]
  stats:
    description: Attribute points.
    usage: /stats [reset]
    aliases: [attributs, attributes]
  titres:
    description: Title collection and equipped title.
    usage: /titles [equip <id>|unequip]
    aliases: [titles, titre, title]
  quetes:
    description: Quest journal, tracker and tutorial.
    usage: /quests [start|abandon|track|tracker|tutorial]
    aliases: [quests, quest, quete, journal]

permissions:
  cykclasses.use:
    description: Use the class system.
    default: true
  cykclasses.reset:
    description: Reset your own class.
    default: true
  cykclasses.bypass.items:
    description: Ignores item restrictions.
    default: false
  cykclasses.bypass.jobs:
    description: Ignores job restrictions.
    default: false
  cykclasses.chat.spy:
    description: See party chats.
    default: false
  cykclasses.admin:
    description: Administration commands.
    default: op
