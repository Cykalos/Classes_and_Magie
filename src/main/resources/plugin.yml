name: Classes_and_Magie
version: '${version}'
main: fr.cykalos.cykclasses.CykClasses
api-version: '26.1'
description: Système de classes RPG avec sous-classes, compétences uniques, statistiques, défauts et mana.
authors: [Cykalos]
website: https://github.com/Cykalos/Classes_and_Magie
softdepend: [PlaceholderAPI, MythicMobs, CraftEngine, ExecutableItems, ItemsAdder, Oraxen, Nexo, MMOItems]
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3

commands:
  classe:
    description: Ouvre le menu des classes et gère sa classe.
    usage: /classe [info|choisir|sous-classe|competences|reset|admin]
    aliases: [class, classes]
  competence:
    description: Lance une compétence de sa classe.
    usage: /competence <id>
    aliases: [skill, cast]
  groupe:
    description: Crée et gère un groupe (règles fixées à la création).
    usage: /groupe [creer|inviter|accepter|refuser|quitter|expulser|chef|dissoudre|info|chat]
    aliases: [party, grp]
  gc:
    description: Chat de groupe (sans message = bascule le chat sur le groupe).
    usage: /gc [message]
    aliases: [pc]
  global:
    description: Revient au chat global (ou envoie un message global).
    usage: /global [message]
    aliases: [all]
  race:
    description: Race de ton personnage.
    usage: /race
  traits:
    description: Tes traits (et relance).
    usage: /traits [relancer]
  metier:
    description: Choisir ou voir ton métier.
    usage: /metier
    aliases: [job, metiers]
  arbre:
    description: Arbre de compétences.
    usage: /arbre [reset]
    aliases: [skilltree, talents]
  stats:
    description: Points d'attributs.
    usage: /stats [reset]
    aliases: [attributs]

permissions:
  cykclasses.use:
    description: Utiliser le système de classes.
    default: true
  cykclasses.reset:
    description: Réinitialiser sa propre classe.
    default: true
  cykclasses.bypass.items:
    description: Ignore les restrictions d'objets.
    default: false
  cykclasses.bypass.jobs:
    description: Ignore les restrictions de métier.
    default: false
  cykclasses.chat.spy:
    description: Voir les chats de groupe.
    default: false
  cykclasses.admin:
    description: Commandes d'administration.
    default: op
