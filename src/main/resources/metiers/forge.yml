# ║              CykClasses - forge.yml          ║
# ╚══════════════════════════════════════════════╝
# Objets de qualité : quand un joueur ayant un de ces métiers fabrique un objet listé,
# l'objet reçoit une rareté, des stats aléatoires (positives ou négatives) et des emplacements de gemmes.
# Plus le niveau du métier est élevé, plus les raretés hautes sont probables.
# Les stats s'appliquent quand l'objet est équipé (arme en main, armure portée, bouclier en main secondaire).
# Les objets de qualité se fabriquent un par un (pas de Maj + clic).

crafters:
  forgeron:
    targets:
      - "(IRON|GOLDEN|DIAMOND|NETHERITE|CHAINMAIL)_(SWORD|AXE|HELMET|CHESTPLATE|LEGGINGS|BOOTS)"
      - "SHIELD"
      - "CROSSBOW"
      - "BOW"
      - "MACE"
  # Exemple : un "archer-artisan" qui fabriquerait les arcs
  # facteur_d_arcs:
  #   targets: ["BOW", "CROSSBOW"]

# Raretés, de la plus commune à la plus rare.
#   weight / weight-per-level / min-weight : chance relative = max(min-weight, weight + weight-per-level × niveau du métier)
#   min-job-level : niveau de métier minimum pour pouvoir l'obtenir
#   stats [min, max] : nombre de stats aléatoires · sockets : emplacements de gemmes
#   power : multiplicateur de la force des stats · negative-chance : chance qu'une stat soit négative
rarities:
  COMMON:
    name: "<white>Commun"
    color: "<white>"
    weight: 100
    weight-per-level: -1.8
    min-weight: 15
    stats: [0, 1]
    sockets: 0
    power: 0.6
    negative-chance: 0.5
  UNCOMMON:
    name: "<green>Peu commun"
    color: "<green>"
    weight: 35
    weight-per-level: 0.3
    stats: [1, 2]
    sockets: 1
    power: 0.8
    negative-chance: 0.35
  RARE:
    name: "<aqua>Rare"
    color: "<aqua>"
    weight: 8
    weight-per-level: 0.6
    min-job-level: 5
    stats: [2, 3]
    sockets: 1
    power: 1.0
    negative-chance: 0.25
  EPIC:
    name: "<light_purple>Épique"
    color: "<light_purple>"
    weight: 2
    weight-per-level: 0.35
    min-job-level: 15
    stats: [3, 4]
    sockets: 2
    power: 1.25
    negative-chance: 0.15
  LEGENDARY:
    name: "<gold>Légendaire"
    color: "<gold>"
    weight: 0.3
    weight-per-level: 0.12
    min-job-level: 25
    stats: [4, 5]
    sockets: 3
    power: 1.5
    negative-chance: 0.05
  # UNIQUE : donne un des objets uniques ci-dessous encore jamais forgé (un seul exemplaire sur tout le serveur).
  # S'il n'en reste plus pour ce type d'objet, l'objet devient Légendaire.
  UNIQUE:
    name: "<gold><bold>UNIQUE</bold>"
    color: "<gold>"
    weight: 0.02
    weight-per-level: 0.02
    min-job-level: 30

# Une stat négative vaut (valeur tirée × negative-scale) en moins
negative-scale: 0.6

# Stats possibles par type d'objet : [min, max] avant le multiplicateur "power" de la rareté.
# Pourcentages : 0.05 = 5 %. damage-taken positif = moins de dégâts subis.
stat-pool:
  weapon:
    melee-damage: [0.02, 0.08]
    crit-chance: [0.01, 0.05]
    crit-multiplier: [0.05, 0.25]
    attack-speed: [0.02, 0.08]
    magic-damage: [0.02, 0.07]
    health: [1, 3]
    mana: [5, 20]
  ranged:
    ranged-damage: [0.02, 0.08]
    crit-chance: [0.01, 0.05]
    speed: [0.01, 0.03]
    mana: [5, 15]
    health: [1, 2]
  armor:
    health: [1, 4]
    armor: [0.5, 2]
    damage-taken: [0.01, 0.04]
    mana: [5, 15]
    mana-regen: [0.1, 0.4]
    speed: [0.01, 0.03]
    magic-damage: [0.01, 0.04]

# Objets uniques : chacun ne peut être forgé qu'UNE SEULE FOIS sur tout le serveur.
# materials : objets de base sur lesquels il peut apparaître. Stats fixes (même format que classes.yml).
# Historique dans forge-uniques.yml · /classe admin libererunique <id> pour le rendre de nouveau disponible :
# l'ancien exemplaire perd alors son pouvoir (il se brise dès qu'il est dans l'inventaire d'un joueur).
uniques:
  excalibur:
    name: "<gold><bold>Excalibur"
    materials: ["*_SWORD"]
    lore: ["<gray>L'épée du roi légendaire.", "<gray>Elle ne répond qu'aux plus dignes."]
    sockets: 3
    stats: {melee-damage: 1.2, crit-chance: 0.1, health: 4}
  briseur_de_montagnes:
    name: "<gold><bold>Briseur de montagnes"
    materials: ["*_AXE", "MACE"]
    lore: ["<gray>Forgé dans le cœur d'un volcan."]
    sockets: 3
    stats: {melee-damage: 1.25, crit-multiplier: 0.5, speed: -0.03}
  aegis:
    name: "<gold><bold>Égide"
    materials: ["SHIELD", "*_CHESTPLATE"]
    lore: ["<gray>Aucun coup ne la traverse."]
    sockets: 3
    stats: {damage-taken: 0.85, health: 6, armor: 3}
  murmure_du_vent:
    name: "<gold><bold>Murmure du vent"
    materials: ["BOW", "CROSSBOW"]
    lore: ["<gray>Ses flèches ne font aucun bruit."]
    sockets: 3
    stats: {ranged-damage: 1.25, crit-chance: 0.08, speed: 0.04}
