# ╔══════════════════════════════════════════════╗
# ║              CykClasses - config             ║
# ╚══════════════════════════════════════════════╝

# Stockage des données joueurs : YAML, JSON ou SQLITE
storage:
  type: YAML
  # Sauvegarde automatique (en secondes)
  autosave-interval: 300
  sqlite-file: data.db

# Niveaux et expérience
leveling:
  max-level: 100
  # XP requise pour passer au niveau suivant = base * (niveau ^ exposant)
  base-xp: 100
  exponent: 1.5
  # XP gagnée par défaut en tuant un monstre (si absent de la liste)
  default-mob-xp: 5
  # XP gagnée en tuant un joueur
  player-kill-xp: 50
  mob-xp:
    zombie: 10
    skeleton: 12
    spider: 10
    creeper: 15
    enderman: 25
    witch: 30
    blaze: 30
    wither_skeleton: 40
    evoker: 60
    ravager: 80
    warden: 500
    ender_dragon: 2000
    wither: 1500
  # Les animaux ne donnent pas d'XP de classe
  ignore-passive-mobs: true
  # PV max gagnés tous les X niveaux (en plus des gains de la classe)
  level-up-heal: true

# Mana
mana:
  # Intervalle de régénération (en ticks, 20 = 1 seconde)
  regen-interval-ticks: 20
  # Le mana régénère-t-il en combat ? (5 secondes après un coup)
  regen-in-combat: true
  combat-regen-multiplier: 0.5

# Lancement des compétences
casting:
  # Appuyer sur F (échange de main) pour entrer/sortir du mode sorts,
  # puis les touches 1 à 9 lancent les compétences.
  swap-hands-toggle: true
  # Faut-il être accroupi pour activer le mode sorts avec F ?
  require-sneak: false
  # Sortie automatique du mode sorts après X secondes d'inactivité
  timeout-seconds: 8
  # Les compétences offensives peuvent-elles toucher les joueurs ?
  pvp: true
  # Les compétences de soutien affectent-elles tous les joueurs proches ?
  support-affects-all-players: true

# Affichage (barre d'action)
hud:
  enabled: true
  interval-ticks: 10
  format: "<red>❤ <health>/<max_health></red>  <aqua>✦ <mana>/<max_mana></aqua>  <gold>Niv. <level></gold> <gray>(<xp_percent>%)</gray>"

# Réinitialisation de classe
reset:
  enabled: true
  # Garder le niveau lors d'un reset ?
  keep-level: false
  # Délai entre deux resets (en minutes)
  cooldown-minutes: 60

# Choisir une classe est-il obligatoire ? (ouvre le menu à la connexion)
force-class-selection: true
