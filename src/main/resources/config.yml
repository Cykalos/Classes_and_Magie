# ╔══════════════════════════════════════════════╗
# ║           Classes and Magie - config         ║
# ╚══════════════════════════════════════════════╝
#
# Rangement des fichiers :
#   classes/     classes.yml, skilltree.yml, attributes.yml
#   personnage/  races.yml, traits.yml, weaknesses.yml, titles.yml
#   metiers/     jobs.yml, forge.yml, gems.yml
#   objets/      kits.yml, items.yml
#   affichage/   hud.yml, messages.yml
#   quetes/      quêtes (tous les fichiers .yml du dossier sont lus)
#   donnees/     données des joueurs et du serveur (ne pas modifier à la main)

# Modules : désactiver ce dont le serveur n'a pas besoin.
# Un module désactivé disparaît du jeu (étape de création sautée, commande indisponible, aucun effet).
modules:
  races: true              # /race, personnage/races.yml
  traits: true             # /traits, personnage/traits.yml
  weaknesses: true         # /faiblesses, personnage/weaknesses.yml
  jobs: true               # /metier, metiers/jobs.yml (actions réservées et XP de métier)
  skill-tree: true         # /arbre, classes/skilltree.yml
  attributes: true         # /stats, classes/attributes.yml
  parties: true            # /groupe, /gc
  forge: true              # objets de qualité (metiers/forge.yml)
  gems: true               # gemmes, joaillerie (metiers/gems.yml)
  kits: true               # kits de départ (objets/kits.yml)
  item-restrictions: true  # conditions d'utilisation des objets (objets/items.yml)
  quests: true             # /quetes, journal et panneau de suivi (dossier quetes/)
  titles: true             # /titres, titres à débloquer (personnage/titles.yml)

# Stockage des données joueurs : YAML, JSON ou SQLITE
storage:
  type: YAML
  # Sauvegarde automatique (en secondes)
  autosave-interval: 300
  sqlite-file: data.db       # dans le dossier donnees/

# Niveaux et expérience
leveling:
  max-level: 100
  # XP requise pour passer au niveau suivant = base * (niveau ^ exposant)
  base-xp: 100
  exponent: 1.5
  # XP gagnée par défaut en tuant un monstre (si absent de la liste)
  default-mob-xp: 5
  # XP gagnée en tuant un joueur
  player-kill-xp: 50
  mob-xp:
    zombie: 10
    skeleton: 12
    spider: 10
    creeper: 15
    enderman: 25
    witch: 30
    blaze: 30
    wither_skeleton: 40
    evoker: 60
    ravager: 80
    warden: 500
    ender_dragon: 2000
    wither: 1500
  # Les animaux ne donnent pas d'XP de classe
  ignore-passive-mobs: true
  # PV max gagnés tous les X niveaux (en plus des gains de la classe)
  level-up-heal: true

# Mana
mana:
  # Intervalle de régénération (en ticks, 20 = 1 seconde)
  regen-interval-ticks: 20
  # Le mana régénère-t-il en combat ? (5 secondes après un coup)
  regen-in-combat: true
  combat-regen-multiplier: 0.5

# Lancement des compétences
# Combat
combat:
  # Les flèches tirées à l'arc par un joueur touchent même si la cible vient de subir des dégâts.
  # Sans ça (comportement de Minecraft), elles rebondissent souvent, par exemple sur un zombie qui brûle au soleil.
  # L'arbalète garde le comportement de Minecraft.
  bow-ignores-hit-delay: true

casting:
  # Appuyer sur F (échange de main) active le mode compétences :
  # la barre d'objets affiche les icônes des compétences (slots 1 à 8),
  # ton arme reste en main dans le slot 9. Les touches 1 à 8 lancent les compétences.
  # F à nouveau (ou un clic dans l'inventaire) pour revenir à ta barre normale.
  swap-hands-toggle: true
  # Faut-il être accroupi pour activer le mode compétences avec F ?
  require-sneak: false
  # Sortie automatique après X secondes sans lancer de compétence (0 = jamais)
  timeout-seconds: 15
  # Icône des compétences pas encore débloquées
  locked-icon: GRAY_DYE
  # Case de remplissage des slots sans compétence (le butin ramassé va alors dans l'inventaire)
  empty-slot-icon: GRAY_STAINED_GLASS_PANE
  # Les compétences offensives peuvent-elles toucher les joueurs hors de ton groupe ?
  pvp: true

# Groupes
party:
  max-size: 5
  invite-timeout-seconds: 60
  # Les membres (et pas seulement le chef) peuvent-ils inviter ?
  members-can-invite: false
  # Dissoudre le groupe quand il ne reste qu'un membre
  disband-when-alone: true
  # Rayon dans lequel les membres reçoivent l'XP d'une élimination
  xp-share-range: 40
  # Mode PARTAGE : bonus d'XP total par membre supplémentaire (0.1 = +10 %)
  shared-bonus-per-member: 0.1
  # Valeurs proposées par défaut dans le menu de création (SHARED ou EQUAL)
  default-xp-mode: SHARED
  default-friendly-fire: true

# MythicMobs (si installé)
mythicmobs:
  # XP par mob MythicMobs (nom interne). Absent = default-xp
  default-xp: 15
  # XP ajoutée par niveau du mob au-delà du niveau 1
  xp-per-level: 2
  mob-xp:
    ExempleBoss: 500

# Points gagnés en montant de niveau
progression:
  # Points d'arbre de compétences (/arbre)
  starting-skill-points: 1
  skill-points-per-level: 1
  # Points d'attributs (/stats)
  starting-attribute-points: 3
  attribute-points-per-level: 2
  # Délai entre deux réinitialisations gratuites (heures)
  tree-reset-cooldown-hours: 24
  attribute-reset-cooldown-hours: 24

# Création du personnage : classe -> race -> traits -> métier
character:
  # La race peut-elle être changée après coup avec /race ?
  race-can-change: false

# Chat
chat:
  # Formate le chat global avec la classe et le niveau (désactive si un autre plugin gère le chat :
  # utilise alors les placeholders %cykclasses_class%, %cykclasses_level%...)
  format-enabled: true
  # Placeholders : <class_tag>, <title> (titre équipé, vide sinon), <name>, <message>
  global-format: "<class_tag> <title><white><name></white><dark_gray> » </dark_gray><gray><message>"
  party-format: "<dark_aqua>[Groupe]</dark_aqua> <class_tag> <title><aqua><name></aqua><dark_gray> » </dark_gray><white><message>"
  # Placeholders : <class>, <level>, <race>
  class-tag: "<dark_gray>[</dark_gray><class> <gray>Niv. <level></gray><dark_gray>]</dark_gray>"
  no-class-tag: "<dark_gray>[<gray>Novice</gray>]</dark_gray>"
  spy-prefix: "<dark_gray>[Espion] "

# Affichage (barre d'action)
hud:
  enabled: true
  # Préfixe affiché devant le HUD quand le mode compétences est actif
  cast-mode-prefix: "<light_purple>✦ </light_purple>"
  interval-ticks: 10
  format: "<red>❤ <health>/<max_health></red>  <aqua>✦ <mana>/<max_mana></aqua>  <gold>Niv. <level></gold> <gray>(<xp_percent>%)</gray>"

# Réinitialisation de classe
reset:
  enabled: true
  # Garder le niveau lors d'un reset ?
  keep-level: false
  # Délai entre deux resets (en minutes)
  cooldown-minutes: 60
  # Garder la race lors d'un reset de classe ? (les traits sont toujours gardés)
  keep-race: true

# Choisir une classe est-il obligatoire ? (ouvre le menu à la connexion)
force-class-selection: true
# Protéger le joueur pendant la création du personnage ? (aucun dégât, ignoré par les monstres,
# ne peut pas attaquer). Fonctionne seulement si force-class-selection est activé.
creation-protection: true

# Quêtes (fichiers dans le dossier quetes/ ; toutes les quêtes sont facultatives)
quests:
  # Proposer le tutoriel à la fin de la création du personnage
  offer-tutorial: true
  # Identifiant de la quête de tutoriel
  tutorial: tutoriel
  # Proposer les quêtes dans le chat ([Accepter] / [Plus tard]) au lieu de les démarrer toutes seules.
  # Les quêtes secrètes démarrent toujours seules quand elles sont découvertes.
  ask-before-start: true
  # Nombre maximum de quêtes en cours en même temps (0 = illimité)
  max-active: 0
  # Nombre de quêtes suivies dans le panneau latéral
  max-tracked: 3
  # Suivre automatiquement une quête quand elle commence
  auto-track: true
  # Masquer dans le journal les quêtes réservées à une autre classe ou une autre race
  hide-other-classes: true
  # Afficher la progression dans la barre d'action
  progress-actionbar: true
  # Fréquence de vérification des objectifs d'état (niveau, objets, lieu…) en ticks (20 = 1 s)
  check-interval-ticks: 20
