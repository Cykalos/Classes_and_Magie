# Quêtes secrètes — invisibles dans le journal tant qu'elles ne sont pas découvertes
# Elles démarrent seules quand leurs conditions sont réunies (conditions:) ou sur une action précise (trigger:).
# Format complet des quêtes : voir le haut de tutoriel.yml
#
# Exemple avec un PNJ nommé (un villageois renommé avec une étiquette, ou un PNJ Citizens) :
#   trigger: {type: INTERACT_ENTITY, targets: [VILLAGER], name: "Ermite"}

quests:
  la_lune_sanglante:
    name: "<dark_red>La Lune sanglante"
    category: SECRET
    level: 10
    icon: REDSTONE
    description:
      - "<gray>Certaines nuits, les morts ont"
      - "<gray>un maître."
    requirements:
      level: 10
    # 5 % de chances de la découvrir en tuant un mort-vivant la nuit
    trigger:
      type: KILL
      targets: [ZOMBIE, HUSK, DROWNED, SKELETON]
      conditions: {time: NIGHT, chance: 0.05}
    stages:
      - text: ["<dark_red>Le ciel rougit… <gray>Quelque chose observe la bataille."]
        objectives:
          - {type: KILL, targets: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, SKELETON, STRAY, BOGGED, WITHER_SKELETON, PHANTOM], amount: 13, conditions: {time: NIGHT}, display: "Éliminer 13 morts-vivants cette nuit"}
      - text: ["<dark_red>Une sorcière rit dans l'ombre : c'est elle qui appelle les morts."]
        objectives:
          - {type: KILL, targets: [WITCH], amount: 1, conditions: {time: NIGHT}, display: "Éliminer la sorcière de la lune"}
    rewards:
      xp: 1500
      attribute-points: 2
      titles: [enfant_de_la_lune]
      items:
        - {item: "minecraft:golden_apple", amount: 1}

  le_murmure_des_abysses:
    name: "<dark_aqua>Le Murmure des abysses"
    category: SECRET
    level: 20
    icon: ECHO_SHARD
    description:
      - "<gray>Tout en bas, le silence a une voix."
    requirements:
      level: 20
    # Découverte en entrant dans les profondeurs obscures
    conditions: {biomes: [DEEP_DARK]}
    stages:
      - text: ["<dark_aqua>Un murmure… <gray><i>« Varenn est passé par ici. Écoute. »</i>"]
        objectives:
          - {type: CONDITION, conditions: {y-below: -40, sneaking: true}, display: "S'accroupir dans le silence des abysses"}
          - {type: COLLECT, targets: [ECHO_SHARD], amount: 3, display: "Trouver des éclats d'écho"}
    rewards:
      xp: 3000
      skill-points: 1
      items:
        - {item: "minecraft:diamond", amount: 2}

  le_pecheur_d_etoiles:
    name: "<blue>Le Pêcheur d'étoiles"
    category: SECRET
    level: 5
    icon: NAUTILUS_SHELL
    description:
      - "<gray>Les nuits d'orage, des étoiles tombent"
      - "<gray>dans l'eau."
    requirements:
      level: 5
    # Découverte en pêchant la nuit sous la pluie
    trigger:
      type: FISH
      conditions: {time: NIGHT, weather: [RAIN, THUNDER]}
    stages:
      - text: ["<blue>Une lueur passe sous la surface… <gray>Il faut continuer à pêcher."]
        objectives:
          - {type: FISH, amount: 20, conditions: {time: NIGHT}, display: "Pêcher 20 fois de nuit"}
    rewards:
      xp: 600
      money: 200
      items:
        - {item: "minecraft:nautilus_shell", amount: 1}

  les_ruines_oubliees:
    name: "<gold>Les Ruines oubliées"
    category: SECRET
    level: 8
    icon: BRUSH
    description:
      - "<gray>Le sable garde la mémoire d'avant"
      - "<gray>la Fracture."
    requirements:
      level: 8
    # Découverte en cassant du sable ou du gravier suspect
    trigger:
      type: BREAK
      targets: [SUSPICIOUS_SAND, SUSPICIOUS_GRAVEL]
    stages:
      - text: ["<gold>Des fragments de poterie… <gray>une civilisation entière dort ici."]
        objectives:
          - {type: COLLECT, targets: ["*_POTTERY_SHERD"], amount: 3, display: "Trouver des tessons de poterie"}
    rewards:
      xp: 800
      attribute-points: 1
