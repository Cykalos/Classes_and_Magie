# Quêtes secrètes d'exemple — invisibles dans le journal tant qu'elles ne sont pas découvertes
# Elles démarrent seules quand leurs conditions sont réunies (conditions:) ou sur une action précise (trigger:).
# Format complet des quêtes : voir le haut de tutoriel.yml
#
# Exemple avec un PNJ nommé (un villageois renommé avec une étiquette, ou un PNJ Citizens) :
#   trigger: {type: INTERACT_ENTITY, targets: [VILLAGER], name: "Ermite"}

quests:
  le_tresor_englouti:
    name: "<dark_aqua>Le Trésor englouti"
    category: SECRET
    level: 15
    icon: HEART_OF_THE_SEA
    description:
      - "<gray>Les épaves cachent parfois"
      - "<gray>bien plus que de l'or."
    requirements:
      level: 15
    # Découverte en nageant en profondeur dans un océan
    conditions: {biomes: ["*OCEAN*"], in-water: true, y-below: 35}
    stages:
      - text: ["<dark_aqua>Une lueur bleue brille au fond de l'eau…"]
        objectives:
          - {type: COLLECT, targets: [HEART_OF_THE_SEA], amount: 1, display: "Trouver un cœur de la mer"}
    rewards:
      xp: 1500
      attribute-points: 2
      titles: [plongeur_des_profondeurs]

  la_nuit_d_orage:
    name: "<yellow>La Nuit d'orage"
    category: SECRET
    level: 8
    icon: LIGHTNING_ROD
    description:
      - "<gray>Quand le tonnerre gronde, les creepers"
      - "<gray>deviennent imprévisibles."
    requirements:
      level: 8
    # 20 % de chances de la découvrir en éliminant un creeper pendant un orage
    trigger:
      type: KILL
      targets: [CREEPER]
      conditions: {weather: [THUNDER], chance: 0.2}
    stages:
      - text: ["<yellow>Un éclair frappe tout près… <gray>L'orage attire les creepers."]
        objectives:
          - {type: KILL, targets: [CREEPER], amount: 5, conditions: {weather: [THUNDER]}, display: "Éliminer 5 creepers pendant l'orage"}
    rewards:
      xp: 900
      money: 150
      titles: [chasseur_d_orages]

  le_jardin_secret:
    name: "<light_purple>Le Jardin secret"
    category: SECRET
    level: 5
    icon: PINK_PETALS
    description:
      - "<gray>La nuit, les cerisiers murmurent."
    requirements:
      level: 5
    # Découverte la nuit dans un bosquet de cerisiers
    conditions: {biomes: [CHERRY_GROVE], time: NIGHT}
    stages:
      - text: ["<light_purple>Des pétales tourbillonnent autour de toi…"]
        objectives:
          - {type: COLLECT, targets: [PINK_PETALS], amount: 16, take: true, display: "Rassembler des pétales roses"}
    rewards:
      xp: 500
      items:
        - {item: "minecraft:cherry_sapling", amount: 4}

  le_chant_des_abeilles:
    name: "<gold>Le Chant des abeilles"
    category: SECRET
    level: 3
    icon: HONEYCOMB
    description:
      - "<gray>Les ruches ont leurs propres secrets."
    requirements:
      level: 3
    # 25 % de chances de la découvrir en utilisant une ruche ou un nid d'abeilles
    trigger:
      type: INTERACT_BLOCK
      targets: [BEEHIVE, BEE_NEST]
      conditions: {chance: 0.25}
    stages:
      - text: ["<gold>Un bourdonnement joyeux… <gray>les abeilles ont du miel à partager."]
        objectives:
          - {type: COLLECT, targets: [HONEY_BOTTLE], amount: 4, take: true, display: "Rassembler des fioles de miel"}
    rewards:
      xp: 400
      money: 80
