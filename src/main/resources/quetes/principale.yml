# Histoire principale d'exemple — « La Guilde des Aventuriers »
# Format complet des quêtes : voir le haut de tutoriel.yml
#
# Lore d'exemple : la Guilde des Aventuriers recrute. Brann, son maître, fait passer les épreuves qui
# permettent de monter en grade, de Recrue à Légende. Tout est modifiable ou supprimable.

quests:
  guilde_recrue:
    name: "<gold>Rang I — Recrue"
    category: MAIN
    level: 2
    icon: STRING
    start: AUTO
    description:
      - "<gray>La Guilde des Aventuriers recrute."
      - "<gray>Première épreuve : les araignées."
    requirements:
      level: 2
    stages:
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Alors comme ça, tu veux rejoindre la Guilde ? Commence par nettoyer les grottes. »</i>"
        objectives:
          - {type: KILL, targets: [SPIDER, CAVE_SPIDER], amount: 4, display: "Éliminer des araignées"}
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Rapporte-moi leur fil, il servira aux cordes de la Guilde. »</i>"
        objectives:
          - {type: COLLECT, targets: [STRING], amount: 6, take: true, display: "Rapporter de la ficelle"}
    rewards:
      xp: 120
      items:
        - {item: "minecraft:cooked_chicken", amount: 8}
    complete-text:
      - "<gold>Brann <dark_gray>» <gray><i>« Bienvenue dans la Guilde, recrue. »</i>"

  guilde_bronze:
    name: "<gold>Rang II — Bronze"
    category: MAIN
    level: 6
    icon: GUNPOWDER
    start: AUTO
    description:
      - "<gray>Les creepers menacent les routes"
      - "<gray>des marchands."
    requirements:
      level: 6
      quests: [guilde_recrue]
    stages:
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Les marchands se plaignent des explosions en forêt. Va voir ça. »</i>"
        objectives:
          - {type: BIOME, targets: ["*FOREST*"], display: "Patrouiller en forêt"}
          - {type: KILL, targets: [CREEPER], amount: 3, display: "Éliminer des creepers"}
      - objectives:
          - {type: COLLECT, targets: [GUNPOWDER], amount: 5, take: true, display: "Rapporter de la poudre à canon"}
    rewards:
      xp: 300
      attribute-points: 1
      items:
        - {item: "minecraft:arrow", amount: 32}

  guilde_argent:
    name: "<gold>Rang III — Argent"
    category: MAIN
    level: 12
    icon: GOAT_HORN
    start: AUTO
    description:
      - "<gray>Les pillards ont installé un camp"
      - "<gray>près des montagnes."
    requirements:
      level: 12
      quests: [guilde_bronze]
    stages:
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Grimpe et repère leur camp depuis les hauteurs. »</i>"
        objectives:
          - {type: CONDITION, conditions: {y-above: 120}, display: "Atteindre un sommet (au-dessus de la couche 120)"}
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Tu les as vus ? Alors chasse-les. »</i>"
        objectives:
          - {type: KILL, targets: [PILLAGER, VINDICATOR], amount: 6, display: "Chasser des pillards"}
    rewards:
      xp: 650
      skill-points: 1
      money: 100

  guilde_or:
    name: "<gold>Rang IV — Or"
    category: MAIN
    level: 20
    icon: PRISMARINE_SHARD
    start: AUTO
    description:
      - "<gray>Les gardiens des océans attaquent"
      - "<gray>les navires de la Guilde."
    requirements:
      level: 20
      quests: [guilde_argent]
    stages:
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Nos bateaux ne reviennent plus. Plonge et trouve ce qui se passe. »</i>"
        objectives:
          - {type: CONDITION, conditions: {in-water: true, y-below: 45}, display: "Plonger en eau profonde (sous la couche 45)"}
          - {type: KILL, targets: [DROWNED], amount: 8, display: "Éliminer des noyés"}
      - objectives:
          - {type: KILL, targets: [GUARDIAN], amount: 3, display: "Éliminer des gardiens"}
    rewards:
      xp: 1100
      attribute-points: 2
      items:
        - {item: "minecraft:golden_apple", amount: 2}

  guilde_platine:
    name: "<gold>Rang V — Platine"
    category: MAIN
    level: 30
    icon: QUARTZ
    start: AUTO
    description:
      - "<gray>Une expédition dans le Nether,"
      - "<gray>réservée aux meilleurs."
    requirements:
      level: 30
      quests: [guilde_or]
    stages:
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« La Guilde finance une expédition dans le Nether. Tu en seras. »</i>"
        objectives:
          - {type: CONDITION, conditions: {dimensions: [NETHER]}, display: "Entrer dans le Nether"}
      - objectives:
          - {type: KILL, targets: [GHAST], amount: 2, display: "Abattre des ghasts"}
          - {type: COLLECT, targets: [QUARTZ], amount: 16, take: true, display: "Rapporter du quartz du Nether"}
    rewards:
      xp: 2600
      skill-points: 1
      attribute-points: 1
      money: 300
      items:
        - {item: "minecraft:diamond", amount: 3}

  guilde_legende:
    name: "<gold>Rang VI — Légende"
    category: MAIN
    level: 45
    icon: NETHER_STAR
    start: AUTO
    description:
      - "<gray>L'épreuve finale : deux monstres"
      - "<gray>que personne n'ose affronter."
    requirements:
      level: 45
      quests: [guilde_platine]
    stages:
      - text:
          - "<gold>Brann <dark_gray>» <gray><i>« Il reste une épreuve. Celle qui fait les légendes. »</i>"
        objectives:
          - {type: KILL, targets: [ELDER_GUARDIAN], amount: 1, display: "Vaincre un gardien ancien"}
          - {type: KILL, targets: [WITHER], amount: 1, display: "Vaincre le Wither"}
    rewards:
      xp: 8000
      skill-points: 2
      attribute-points: 3
      money: 1000
      items:
        - {item: "minecraft:netherite_ingot", amount: 1}
      titles: [legende_de_la_guilde]
    complete-text:
      - "<gold>Brann <dark_gray>» <gray><i>« Ton nom sera gravé sur le mur de la Guilde. Légende. »</i>"
