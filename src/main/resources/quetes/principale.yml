# Histoire principale — « Les Éclats de la Fracture »
# Format complet des quêtes : voir le haut de tutoriel.yml
#
# Lore d'exemple : il y a longtemps, l'archimage Varenn voulut enchaîner le ciel avec la Couronne d'Astre.
# La Couronne se brisa : c'est la Fracture. Ses Éclats tombèrent sur le monde, réveillant les morts et
# ouvrant la Porte Brûlante. Ceux dont l'âme a résonné avec un Éclat sont les Éveillés. L'Archiviste Maëlis,
# gardienne de la mémoire d'avant la Fracture, les guide par la pensée.

quests:
  le_reveil:
    name: "<gold>I. Le Réveil des morts"
    category: MAIN
    level: 2
    icon: ROTTEN_FLESH
    start: AUTO
    description:
      - "<gray>Depuis la Fracture, les morts ne"
      - "<gray>reposent plus. Une voix t'appelle."
    requirements:
      level: 2
    stages:
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Éveillé… m'entends-tu ? Je suis Maëlis, l'Archiviste.</i>"
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>Depuis la Fracture, les morts se relèvent. Montre-moi ce que vaut ton Éclat. »</i>"
        objectives:
          - {type: KILL, targets: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER], amount: 6, display: "Éliminer des morts-vivants"}
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Leur chair porte la marque des Éclats. Rapporte-m'en, je dois l'étudier. »</i>"
        objectives:
          - {type: COLLECT, targets: [ROTTEN_FLESH], amount: 8, take: true, display: "Rapporter de la chair putréfiée"}
    rewards:
      xp: 120
      items:
        - {item: "minecraft:bread", amount: 8}
    complete-text:
      - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Bien. Tu n'es pas comme les autres. Nous nous reparlerons. »</i>"

  les_murmures:
    name: "<gold>II. Les Murmures des profondeurs"
    category: MAIN
    level: 5
    icon: LANTERN
    start: AUTO
    description:
      - "<gray>Sous la terre, quelque chose murmure"
      - "<gray>le nom de Varenn."
    requirements:
      level: 5
      quests: [le_reveil]
    stages:
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Les mineurs entendent des voix sous la roche. Descends, et sois prudent. »</i>"
        objectives:
          - {type: CONDITION, conditions: {y-below: 30}, display: "Descendre sous la couche 30"}
          - {type: KILL, targets: [SKELETON, STRAY, BOGGED], amount: 5, display: "Éliminer des squelettes"}
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Il me faut de quoi alimenter les lanternes des Archives. »</i>"
        objectives:
          - {type: COLLECT, targets: [COAL, CHARCOAL], amount: 16, take: true, display: "Rapporter du charbon"}
    rewards:
      xp: 300
      job-xp: 100
      attribute-points: 1
      items:
        - {item: "minecraft:torch", amount: 32}

  les_eclats:
    name: "<gold>III. Les premiers Éclats"
    category: MAIN
    level: 10
    icon: AMETHYST_SHARD
    start: AUTO
    description:
      - "<gray>Les Éclats d'astre brillent dans les"
      - "<gray>terres sauvages. Il faut les retrouver."
    requirements:
      level: 10
      quests: [les_murmures]
    stages:
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Les Éclats sont tombés loin d'ici. Voyage, et ouvre l'œil. »</i>"
        objectives:
          - {type: BIOME, targets: ["*DESERT*", "*BADLANDS*"], display: "Explorer un désert ou des badlands"}
          - {type: BIOME, targets: ["*JUNGLE*", "*SWAMP*"], display: "Explorer une jungle ou un marais"}
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Les sorcières ont goûté aux Éclats. Elles en portent encore. »</i>"
        objectives:
          - {type: KILL, targets: [WITCH], amount: 2, display: "Éliminer des sorcières corrompues"}
          - {type: COLLECT, targets: [AMETHYST_SHARD], amount: 4, take: true, display: "Rassembler des fragments d'astre (améthyste)"}
    rewards:
      xp: 600
      skill-points: 1
      money: 100

  la_nuit_des_eveilles:
    name: "<gold>IV. La Nuit des Éveillés"
    category: MAIN
    level: 15
    icon: PHANTOM_MEMBRANE
    start: AUTO
    description:
      - "<gray>Chaque nuit, la Fracture s'élargit."
      - "<gray>Les Éveillés doivent tenir la ligne."
    requirements:
      level: 15
      quests: [les_eclats]
    stages:
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« La nuit, les créatures de la Fracture sont plus nombreuses. Tiens bon. »</i>"
        objectives:
          - type: KILL
            targets: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, SKELETON, STRAY, BOGGED, SPIDER, CREEPER, WITCH, ENDERMAN, PHANTOM]
            amount: 25
            conditions: {time: NIGHT}
            display: "Éliminer des monstres de nuit"
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Les Phantoms sont les veilleurs de Varenn. Abats-les. »</i>"
        objectives:
          - {type: KILL, targets: [PHANTOM], amount: 3, display: "Abattre des Phantoms"}
    rewards:
      xp: 1000
      attribute-points: 2
      items:
        - {item: "minecraft:golden_apple", amount: 2}

  la_porte_brulante:
    name: "<gold>V. La Porte Brûlante"
    category: MAIN
    level: 25
    icon: BLAZE_ROD
    start: AUTO
    description:
      - "<gray>La Fracture a ouvert un passage vers"
      - "<gray>un monde de flammes."
    requirements:
      level: 25
      quests: [la_nuit_des_eveilles]
    stages:
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Varenn a fui par la Porte Brûlante. Il faut la franchir. »</i>"
        objectives:
          - {type: CONDITION, conditions: {dimensions: [NETHER]}, display: "Franchir la Porte Brûlante (Nether)"}
      - objectives:
          - {type: KILL, targets: [BLAZE], amount: 6, display: "Éliminer des Blazes"}
          - {type: COLLECT, targets: [BLAZE_ROD], amount: 4, take: true, display: "Rapporter des bâtons de Blaze"}
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Les squelettes noirs gardent la forteresse. Brise leur garde. »</i>"
        objectives:
          - {type: KILL, targets: [WITHER_SKELETON], amount: 5, display: "Éliminer des Wither squelettes"}
    rewards:
      xp: 2500
      skill-points: 1
      attribute-points: 1
      money: 300
      items:
        - {item: "minecraft:diamond", amount: 3}

  le_coeur_de_la_fracture:
    name: "<gold>VI. Le Cœur de la Fracture"
    category: MAIN
    level: 40
    icon: DRAGON_EGG
    start: AUTO
    description:
      - "<gray>Au bout du monde bat le Cœur de la"
      - "<gray>Fracture, gardé par un dragon."
    requirements:
      level: 40
      quests: [la_porte_brulante]
    stages:
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Le dernier Éclat bat au-delà des étoiles, dans la Fin. Le Cœur de la Fracture. »</i>"
        objectives:
          - {type: CONDITION, conditions: {dimensions: [THE_END]}, display: "Atteindre la Fin"}
      - text:
          - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Le dragon est le dernier gardien de Varenn. Tout repose sur toi, Éveillé. »</i>"
        objectives:
          - {type: KILL, targets: [ENDERMAN], amount: 10, display: "Éliminer des Endermen"}
          - {type: KILL, targets: [ENDER_DRAGON], amount: 1, display: "Vaincre le Dragon, gardien du Cœur"}
    rewards:
      xp: 8000
      skill-points: 2
      attribute-points: 3
      money: 1000
      items:
        - {item: "minecraft:netherite_ingot", amount: 1}
      titles: [heros_de_la_fracture]
      text:
        - "<light_purple>La gratitude éternelle de l'Archiviste"
    complete-text:
      - "<dark_aqua>Maëlis <dark_gray>» <gray><i>« Le Cœur s'est tu. La Fracture ne se refermera pas d'un coup…</i>"
      - "<dark_aqua>Maëlis <dark_gray>» <gray><i>mais grâce à toi, le monde a de nouveau un avenir. Merci, Éveillé. »</i>"
