# Quêtes de classe d'exemple — deux quêtes par classe (sous-classes comprises)
# Format complet des quêtes : voir le haut de tutoriel.yml
# Une quête réservée à une autre classe est masquée dans le journal (config.yml → quests.hide-other-classes).

quests:
  # ─────────────────────────────── Guerrier
  guerrier_mur_de_boucliers:
    name: "<red>Le Mur de boucliers"
    category: CLASS
    start: OFFER
    level: 3
    icon: IRON_AXE
    description: ["<gray>Tenir la ligne et frapper fort."]
    requirements:
      classes: [guerrier]
      level: 3
    stages:
      - objectives:
          - {type: DAMAGE, amount: 300, conditions: {holding: ["*_SWORD", "*_AXE", "MACE"]}, display: "Infliger des dégâts au corps à corps"}
          - {type: SKILL, targets: [tourbillon], amount: 5, display: "Utiliser Tourbillon"}
    rewards:
      xp: 250
      attribute-points: 1

  guerrier_briseur_de_rangs:
    name: "<red>Briseur de rangs"
    category: CLASS
    start: OFFER
    level: 15
    icon: MACE
    description: ["<gray>Aucune bête n'arrête un guerrier lancé."]
    requirements:
      classes: [guerrier]
      level: 15
      quests: [guerrier_mur_de_boucliers]
    stages:
      - objectives:
          - {type: SKILL, targets: [charge], amount: 15, display: "Utiliser Charge"}
          - {type: KILL, targets: [RAVAGER], amount: 1, display: "Abattre un ravageur"}
    rewards:
      xp: 1200
      skill-points: 1

  # ─────────────────────────────── Mage
  mage_etincelles:
    name: "<light_purple>Étincelles"
    category: CLASS
    start: OFFER
    level: 3
    icon: SLIME_BALL
    description: ["<gray>Un bouclier d'abord, des sorts ensuite."]
    requirements:
      classes: [mage]
      level: 3
    stages:
      - objectives:
          - {type: SKILL, targets: [bouclier_de_mana], amount: 5, display: "Utiliser Bouclier de mana"}
          - {type: KILL, targets: [SLIME, MAGMA_CUBE], amount: 6, display: "Éliminer des slimes"}
    rewards:
      xp: 250
      attribute-points: 1

  mage_savoir_interdit:
    name: "<light_purple>Le Savoir interdit"
    category: CLASS
    start: OFFER
    level: 15
    icon: ENCHANTING_TABLE
    description: ["<gray>Les enchantements cachent des secrets."]
    requirements:
      classes: [mage]
      level: 15
      quests: [mage_etincelles]
    stages:
      - objectives:
          - {type: ENCHANT, amount: 5, display: "Enchanter des objets"}
          - {type: SKILL, targets: [projectile_arcanique], amount: 40, display: "Lancer Projectile arcanique"}
    rewards:
      xp: 1200
      skill-points: 1

  # ─────────────────────────────── Archer
  archer_tir_de_precision:
    name: "<green>Tir de précision"
    category: CLASS
    start: OFFER
    level: 3
    icon: TARGET
    description: ["<gray>Un bon archer recule avant de tirer."]
    requirements:
      classes: [archer]
      level: 3
    stages:
      - objectives:
          - {type: KILL, targets: [SKELETON, STRAY, BOGGED], amount: 8, conditions: {holding: [BOW, CROSSBOW]}, display: "Abattre des squelettes à distance"}
          - {type: SKILL, targets: [bond_arriere], amount: 5, display: "Utiliser Bond arrière"}
    rewards:
      xp: 250
      attribute-points: 1

  archer_traque_ardente:
    name: "<green>Traque ardente"
    category: CLASS
    start: OFFER
    level: 15
    icon: BLAZE_POWDER
    description: ["<gray>Même les flammes ont un point faible."]
    requirements:
      classes: [archer]
      level: 15
      quests: [archer_tir_de_precision]
    stages:
      - objectives:
          - {type: KILL, targets: [BLAZE], amount: 5, conditions: {holding: [BOW, CROSSBOW]}, display: "Abattre des blazes à distance"}
          - {type: SKILL, targets: [fleche_percante], amount: 20, display: "Utiliser Flèche perçante"}
    rewards:
      xp: 1200
      skill-points: 1

  # ─────────────────────────────── Assassin
  assassin_lame_nocturne:
    name: "<dark_gray>Lame nocturne"
    category: CLASS
    start: OFFER
    level: 3
    icon: SPIDER_EYE
    description: ["<gray>Le poison fait le reste."]
    requirements:
      classes: [assassin]
      level: 3
    stages:
      - objectives:
          - {type: KILL, targets: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, SKELETON, STRAY, BOGGED, SPIDER, CAVE_SPIDER, CREEPER, WITCH, SLIME, ENDERMAN, PHANTOM, PILLAGER, VINDICATOR, SILVERFISH], amount: 10, conditions: {time: NIGHT}, display: "Éliminer des monstres de nuit"}
          - {type: SKILL, targets: [lame_empoisonnee], amount: 5, display: "Utiliser Lame empoisonnée"}
    rewards:
      xp: 250
      attribute-points: 1

  assassin_fantome:
    name: "<dark_gray>Fantôme"
    category: CLASS
    start: OFFER
    level: 15
    icon: GRAY_DYE
    description: ["<gray>Apparaître, frapper, disparaître."]
    requirements:
      classes: [assassin]
      level: 15
      quests: [assassin_lame_nocturne]
    stages:
      - objectives:
          - {type: KILL, targets: [WITCH], amount: 5, conditions: {sneaking: true}, display: "Éliminer des sorcières en étant accroupi"}
          - {type: SKILL, targets: [pas_de_l_ombre], amount: 15, display: "Utiliser Pas de l'ombre"}
    rewards:
      xp: 1200
      skill-points: 1

  # ─────────────────────────────── Clerc
  clerc_premiers_soins:
    name: "<yellow>Premiers soins"
    category: CLASS
    start: OFFER
    level: 3
    icon: GLISTERING_MELON_SLICE
    description: ["<gray>Protéger les autres avant soi-même."]
    requirements:
      classes: [clerc]
      level: 3
    stages:
      - objectives:
          - {type: SKILL, targets: [benediction], amount: 8, display: "Utiliser Bénédiction"}
          - {type: KILL, targets: [SKELETON, STRAY], amount: 8, display: "Éliminer des squelettes"}
    rewards:
      xp: 250
      attribute-points: 1

  clerc_lumiere_sacree:
    name: "<yellow>Lumière sacrée"
    category: CLASS
    start: OFFER
    level: 15
    icon: BEACON
    description: ["<gray>Porter la lumière jusque dans le Nether."]
    requirements:
      classes: [clerc]
      level: 15
      quests: [clerc_premiers_soins]
    stages:
      - objectives:
          - {type: SKILL, targets: [soin], amount: 40, display: "Utiliser Soin"}
          - {type: KILL, targets: [WITHER_SKELETON], amount: 5, display: "Éliminer des wither squelettes"}
    rewards:
      xp: 1200
      skill-points: 1
