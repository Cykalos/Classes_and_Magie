# Quêtes annexes — facultatives, certaines répétables
# Format complet des quêtes : voir le haut de tutoriel.yml

quests:
  provisions:
    name: "<aqua>Provisions pour la route"
    category: SIDE
    level: 1
    icon: BREAD
    description:
      - "<gray>Les voyageurs ont toujours faim."
    stages:
      - text: ["<aqua>L'aubergiste <dark_gray>» <gray><i>« Du pain ! Il m'en faut pour les caravanes. »</i>"]
        objectives:
          - {type: COLLECT, targets: [BREAD], amount: 16, take: true, display: "Rapporter du pain"}
    rewards:
      xp: 80
      money: 50
      items:
        - {item: "minecraft:cooked_beef", amount: 8}

  le_coup_de_main:
    name: "<aqua>Le Coup de main"
    category: SIDE
    level: 3
    icon: TORCH
    description:
      - "<gray>Les rues sont trop sombres la nuit."
    stages:
      - objectives:
          - {type: CRAFT, targets: [TORCH], amount: 16, display: "Fabriquer des torches (16 fois)"}
    rewards:
      xp: 150
      job-xp: 150

  peche_du_jour:
    name: "<aqua>La Pêche du jour"
    category: SIDE
    level: 3
    icon: FISHING_ROD
    repeatable: true
    cooldown-hours: 12
    description:
      - "<gray>Répétable toutes les 12 heures."
    stages:
      - objectives:
          - {type: FISH, amount: 15, display: "Pêcher 15 fois"}
    rewards:
      xp: 200
      money: 60

  chasseur_de_primes:
    name: "<aqua>Chasseur de primes"
    category: SIDE
    level: 5
    icon: CROSSBOW
    repeatable: true
    cooldown-hours: 24
    description:
      - "<gray>Le tableau des primes se renouvelle"
      - "<gray>chaque jour."
    stages:
      - objectives:
          - type: KILL
            targets: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, SKELETON, STRAY, BOGGED, SPIDER, CAVE_SPIDER, CREEPER, WITCH, SLIME, ENDERMAN, PHANTOM, PILLAGER, VINDICATOR, SILVERFISH]
            amount: 30
            display: "Éliminer 30 monstres"
    rewards:
      xp: 300
      money: 100

  l_explorateur:
    name: "<aqua>L'Explorateur"
    category: SIDE
    level: 10
    icon: FILLED_MAP
    description:
      - "<gray>Les cartographes paient bien les"
      - "<gray>récits de terres lointaines."
    stages:
      - objectives:
          - {type: BIOME, targets: ["*SNOWY*", "*FROZEN*", "ICE_SPIKES"], display: "Explorer une terre gelée"}
          - {type: BIOME, targets: [CHERRY_GROVE], display: "Explorer un bosquet de cerisiers"}
          - {type: BIOME, targets: [MUSHROOM_FIELDS], display: "Explorer une île aux champignons"}
          - {type: BIOME, targets: ["*OCEAN*"], display: "Naviguer en pleine mer"}
    rewards:
      xp: 800
      money: 150
      items:
        - {item: "minecraft:spyglass", amount: 1}
