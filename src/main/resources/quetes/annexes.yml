# Quêtes annexes d'exemple — facultatives, certaines répétables
# Format complet des quêtes : voir le haut de tutoriel.yml

quests:
  le_boulanger:
    name: "<aqua>Le Boulanger"
    category: SIDE
    level: 1
    icon: WHEAT
    description: ["<gray>Le four du village a besoin de blé."]
    stages:
      - objectives:
          - {type: COLLECT, targets: [WHEAT], amount: 32, take: true, display: "Rapporter du blé"}
    rewards:
      xp: 80
      money: 40
      items:
        - {item: "minecraft:bread", amount: 12}

  bois_pour_l_hiver:
    name: "<aqua>Du bois pour l'hiver"
    category: SIDE
    level: 2
    icon: OAK_LOG
    description: ["<gray>Les nuits vont être froides."]
    stages:
      - objectives:
          - {type: COLLECT, targets: [OAK_LOG, BIRCH_LOG, SPRUCE_LOG], amount: 32, take: true, display: "Rapporter des bûches"}
    rewards:
      xp: 120
      job-xp: 100

  concours_de_peche:
    name: "<aqua>Concours de pêche"
    category: SIDE
    level: 3
    icon: COD
    repeatable: true
    cooldown-hours: 24
    description: ["<gray>Répétable chaque jour."]
    stages:
      - objectives:
          - {type: FISH, amount: 10, display: "Pêcher 10 fois"}
    rewards:
      xp: 150
      money: 50

  patrouille_de_nuit:
    name: "<aqua>Patrouille de nuit"
    category: SIDE
    level: 5
    icon: LANTERN
    repeatable: true
    cooldown-hours: 24
    description: ["<gray>Répétable chaque jour."]
    stages:
      - objectives:
          - {type: KILL, targets: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER, SKELETON, STRAY, BOGGED, SPIDER, CAVE_SPIDER, CREEPER, WITCH, SLIME, ENDERMAN, PHANTOM, PILLAGER, VINDICATOR, SILVERFISH], amount: 20, conditions: {time: NIGHT}, display: "Éliminer 20 monstres de nuit"}
    rewards:
      xp: 350
      money: 100

  le_cartographe:
    name: "<aqua>Le Cartographe"
    category: SIDE
    level: 8
    icon: COMPASS
    description: ["<gray>Des cartes à compléter, des terres à décrire."]
    stages:
      - objectives:
          - {type: BIOME, targets: ["*SAVANNA*"], display: "Explorer une savane"}
          - {type: BIOME, targets: ["*TAIGA*"], display: "Explorer une taïga"}
          - {type: BIOME, targets: ["*BIRCH*"], display: "Explorer une forêt de bouleaux"}
          - {type: BIOME, targets: ["*BEACH*"], display: "Longer une plage"}
    rewards:
      xp: 700
      money: 150
      items:
        - {item: "minecraft:map", amount: 4}
